<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VINEK</title>
<meta name="theme-color" content="#06080b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VINEK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080b; --card:#0f1318; --card2:#151a21; --line:#1d242e; --ink:#f3f5f7; --muted:#8a94a3; --dim:#5b6472;
  --kcal:#3cf28a; --prot:#ff7a2f; --carb:#ffd23f; --gord:#c86bff; --agua:#31c8ff; --bad:#ff4d5e; --ok:#3cf28a;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 50% -200px,#0f2a1d 0%,transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* topo */
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;background:rgba(6,8,11,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.arrow:active{transform:scale(.92)}
.datebox{flex:1;text-align:center;position:relative}
.datebox .d{font-weight:800;font-size:20px;letter-spacing:-.02em}
.datebox .s{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.datebox input{position:absolute;inset:0;opacity:0;width:100%}
#hoje{display:block;margin:0 auto 4px;font-size:12px;font-weight:700;padding:5px 14px;border-radius:99px;border:0;background:var(--kcal);color:#04140b}
main{padding:6px 16px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;position:relative;overflow:hidden}
.card h2{margin:0 0 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .t{display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--dim)}
.tap{cursor:pointer}
.tap:active{transform:scale(.99)}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* herói com anéis */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.rings{width:150px;height:150px}
.rings circle,.minis circle,.prog circle{fill:none;stroke-linecap:round}
.ring-fg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.legend .it{margin-bottom:10px}
.legend .lab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.legend .lab i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.legend .val small{font-size:13px;color:var(--muted);font-weight:600}
.score{background:radial-gradient(400px 220px at 50% 0%,var(--glow) 0%,transparent 70%),var(--card)}
.gauge{display:block;margin:0 auto;width:230px;height:130px;overflow:visible}
.gauge .n{font-size:58px;font-weight:900;letter-spacing:-.04em}
.score .lbl{text-align:center;font-weight:900;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-top:-4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:22px;font-weight:900;letter-spacing:-.02em}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:14px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;border-radius:6px 6px 3px 3px;min-height:4px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.spark span{font-size:10px;font-weight:700;color:var(--dim)}
.spark em{font-style:normal;font-size:10px;font-weight:800;color:var(--muted)}
.spark .cur em{color:var(--ink)}
.spark .cur span{color:var(--ink)}
.cats{margin-top:12px}
.cats .c{display:grid;grid-template-columns:112px 1fr 30px;gap:8px;align-items:center;font-size:12px;margin-top:7px}
.cats .c b{text-align:right;font-variant-numeric:tabular-nums}
.nota{position:absolute;top:14px;right:14px;top:14px;right:14px;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#3cf28a22,#31c8ff22);
  border:1px solid #3cf28a55;color:var(--kcal);padding:4px 10px;border-radius:99px;font-weight:800;font-size:14px}

/* barras finas */
.slim{margin-top:6px}
.slim .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.slim .top b{font-weight:700}
.track{height:8px;background:#1a2029;border-radius:99px;overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* linhas */
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:#1a2029;color:var(--muted)}
.chip.ok{background:#3cf28a1f;color:var(--ok)}
.chip.warn{background:#ffd23f1f;color:var(--carb)}
.chip.bad{background:#ff4d5e1f;color:var(--bad)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid #2a323e;background:transparent;display:grid;place-items:center;color:transparent;flex:none}
.check:active{border-color:var(--kcal);color:var(--kcal)}

/* mini anéis (nutrição) */
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.minis svg{width:72px;height:72px}
.minis .v{font-weight:800;font-size:15px;margin-top:2px}
.minis .l{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* botões rápidos */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qb{border:1px solid var(--line);background:var(--card2);border-radius:18px;padding:14px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.qb .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.qb .ic svg.i{width:22px;height:22px}
.qb .n{font-size:12px;font-weight:700;line-height:1.15}
.qb .k{font-size:11px;color:var(--muted);font-weight:600}
.qb:active{transform:scale(.93)}
.qb.pop{animation:pop .45s}
@keyframes pop{0%{box-shadow:0 0 0 0 #3cf28a88}100%{box-shadow:0 0 0 14px #3cf28a00}}
.sub{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}

/* água */
.water{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.water .big{font-size:40px;font-weight:900;letter-spacing:-.03em;color:var(--agua);line-height:1}
.water .big small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}

/* botões */
.btn{border:0;background:var(--kcal);color:#04140b;border-radius:14px;padding:12px 16px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:12px}
.btn:active{transform:scale(.96)}
.x{border:0;background:transparent;color:var(--dim);padding:6px;display:grid;place-items:center}

/* especialista */
.spec{background:linear-gradient(135deg,#0f2a1d,#0f1318 70%);border-color:#1f4a33}
.spec .who{font-weight:900;color:var(--kcal);letter-spacing:.08em;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.spec p{margin:0;font-size:15px;line-height:1.45}
.spec.doc{background:linear-gradient(135deg,#2a1530,#0f1318 70%);border-color:#4a2a55}
.spec.doc .who{color:var(--gord)}
.spec .when{margin-left:auto;font-weight:600;font-size:11px;color:var(--dim);letter-spacing:0}
.spec.dona{background:linear-gradient(135deg,#2a2510,#0f1318 70%);border-color:#4a4220}
.spec.dona .who{color:var(--carb)}
.spec.play{background:linear-gradient(135deg,#2a1014,#0f1318 70%);border-color:#4a2026}
.spec.play .who{color:var(--bad)}
.lb{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.check.on{border-color:var(--kcal);background:var(--kcal);color:#04140b}
.cats.fin .c{grid-template-columns:120px 1fr 60px}
.vid{padding:12px 0;border-top:1px solid var(--line)}
.vid:first-of-type{border-top:0;padding-top:0}
.etapas{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.et{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 0;font-size:11px;font-weight:700;color:var(--dim)}
.et.andamento{border-color:var(--carb);color:var(--carb);background:#ffd23f14}
.et.feito{border-color:var(--ok);background:var(--ok);color:#04140b}
.rp b{white-space:nowrap}
/* painel colorido */
.painel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.painel.p3{grid-template-columns:repeat(3,1fr)}
.pt{border:0;text-align:left;border-radius:20px;padding:12px 14px;color:#fff;background:linear-gradient(145deg,var(--a) 0%,color-mix(in srgb,var(--a) 45%,var(--b)) 100%);box-shadow:0 6px 22px color-mix(in srgb,var(--a) 30%,transparent);position:relative;overflow:hidden;min-height:96px}
.pt:active{transform:scale(.97)}
.pk{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;opacity:.9}
.pk svg.i{width:15px;height:15px}
.pv{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.pv small{font-size:14px;font-weight:700;opacity:.8}
.ps{font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.pb{height:5px;background:#ffffff33;border-radius:99px;margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.p3 .pv{font-size:26px}
/* despensa nos registros */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.di{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.di b{font-size:13px;line-height:1.2}
.di span{font-size:11px;color:var(--muted);font-weight:600}
.di.zero{opacity:.45}
.di:active{transform:scale(.95)}
.amac{display:flex;justify-content:space-between;margin-top:12px;font-size:14px;background:var(--card2);border-radius:12px;padding:10px 12px}
.amac b{font-size:17px}
#prato{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;max-width:560px;margin:0 auto;background:#10261a;border:1px solid var(--kcal);
  border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 0 24px #3cf28a33}
#prato .grow{flex:1;min-width:0}
.rp.dp{align-items:center}
.rp .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rp .chips .chip{font-size:10px;padding:2px 7px}
.rp .title{display:block}
/* conquistas */
.conq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cq{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;opacity:.6}
.cq.on{opacity:1;border-color:var(--carb);background:linear-gradient(180deg,#ffd23f1f,var(--card2))}
.cq .ci{color:var(--dim);display:grid;place-items:center}
.cq.on .ci{color:var(--carb);filter:drop-shadow(0 0 6px var(--carb))}
.cq .ct{font-size:12px;font-weight:800;margin-top:4px;line-height:1.15}
.cq .cs{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}

/* chat flutuante */
#fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:8;width:56px;height:56px;border-radius:50%;border:0;
  background:linear-gradient(145deg,var(--kcal),#1fb8ff);color:#04140b;display:grid;place-items:center;box-shadow:0 8px 26px #3cf28a55}
#fab svg.i{width:26px;height:26px}
#fab:active{transform:scale(.92)}
body.compr #fab{bottom:calc(156px + env(safe-area-inset-bottom))}
#chat{position:fixed;inset:0;z-index:30;background:rgba(3,5,8,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.chbox{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(600px 300px at 85% -60px,#1fb8ff22,transparent 70%),radial-gradient(500px 280px at 0% 0%,#3cf28a1c,transparent 70%),var(--bg);animation:up .22s ease-out}
@media (min-width:700px){.chbox{width:520px;height:min(760px,88vh);border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px #000c,0 0 0 1px #3cf28a14}}
.chh{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.chav{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;color:#04140b;background:linear-gradient(145deg,var(--kcal),#1fb8ff);box-shadow:0 6px 18px #3cf28a40}
.chav svg.i{width:22px;height:22px}
.chh .grow{flex:1;min-width:0}
.chh .grow b{font-size:17px;font-weight:900;letter-spacing:-.02em}
.chh .grow small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.chh .grow small i{width:7px;height:7px;border-radius:50%;background:var(--kcal);box-shadow:0 0 8px var(--kcal)}
.chib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center}
.chib svg.i{width:18px;height:18px}
.chib:active{transform:scale(.92)}
#chLog{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:#1d242e transparent}
.chvz{margin:auto 0;padding:8px 0;text-align:center}
.chvz .chav{width:64px;height:64px;border-radius:22px;margin:0 auto 14px}
.chvz .chav svg.i{width:30px;height:30px}
.chvz h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.chvz p{margin:6px auto 18px;max-width:320px;color:var(--muted);font-size:14px;line-height:1.4}
.chg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;text-align:left}
.chg button{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;color:var(--ink);display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;line-height:1.2}
.chg button:active{transform:scale(.96)}
.chg button span{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.chg button span svg.i{width:18px;height:18px}
.chg button div{min-width:0;text-align:left}
.chg button em{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.bl{max-width:84%;padding:10px 14px;border-radius:20px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:up .18s ease-out}
.bl.eu{align-self:flex-end;background:linear-gradient(145deg,var(--kcal),#2ad6a0);color:#04140b;border-bottom-right-radius:6px;font-weight:600}
.bl.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bl.ai.err{border-color:#ff4d5e66;background:#ff4d5e12}
.bl img{display:block;max-width:200px;border-radius:14px;margin-bottom:6px}
.bl .ac{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.bl .ac span{font-size:12.5px;font-weight:700;background:#3cf28a14;border:1px solid #3cf28a33;color:var(--kcal);border-radius:10px;padding:5px 9px}
.bl .tr{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px}
.bl.pens{color:var(--muted);display:flex;gap:8px;align-items:center}
.bl.pens:before{content:'';width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--kcal);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.chin{margin:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px #0008}
.chin:focus-within{border-color:#3cf28a66}
.chin textarea{flex:1;resize:none;min-height:40px;max-height:120px;border:0;outline:0;background:transparent;color:var(--ink);padding:10px 4px;font:inherit;font-size:15px}
.chin .cb{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);display:grid;place-items:center}
.chin .cb svg.i{width:19px;height:19px}
.chin .cb.send{background:var(--kcal);color:#04140b}
.chin .cb.rec{background:var(--bad);color:#fff;animation:pulso 1s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 8px #ff4d5e33}}
#chFoto{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
#chFoto img{height:48px;width:48px;object-fit:cover;border-radius:10px}


/* navegação */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;max-width:520px;margin:0 auto;
  background:rgba(17,21,27,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;display:flex;padding:6px}
nav button{flex:1;border:0;background:transparent;padding:8px 0;font-size:11px;font-weight:700;color:var(--dim);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:#04140b;background:var(--kcal)}
nav button{position:relative}
nav button .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--prot);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.q{padding:14px 0}
.q+.q{border-top:1px solid var(--line)}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.q .qt small{color:var(--dim);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;min-width:40px}
.opt.sel{background:var(--kcal);color:#04140b;border-color:var(--kcal)}
.opt:active{transform:scale(.93)}
.opts.esc .opt{flex:1 0 calc(16.66% - 6px);padding:9px 0;min-width:0}
.inl{display:flex;gap:8px;margin-top:8px}
.inl input{flex:1}
.done{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:8px}
.done .v{font-weight:700;color:var(--kcal);text-align:right}
.prog{display:flex;align-items:center;gap:14px}

#tmV{font-size:34px;font-weight:900;color:var(--prot);line-height:1}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:4px}
.tb td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
.tb td:first-child,.tb th:first-child{text-align:left;color:var(--muted)}
.link{display:block;margin:12px auto 0;border:0;background:transparent;color:var(--dim);font-size:12px;text-decoration:underline;text-underline-offset:3px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
#sheet .sh{background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:640px;margin:0 auto;max-height:75vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rp{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0;display:flex;justify-content:space-between;gap:10px}
.seq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sq{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.sq .f{color:var(--dim);display:grid;place-items:center}
.sq .n{font-size:24px;font-weight:900;line-height:1.1}
.sq .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sq.on{border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,transparent),var(--card2))}
.sq.on .f{color:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.sq.on .n{color:var(--c)}

  border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:560px;margin:0 auto;font-weight:600;
  animation:up .25s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
#toast button{background:transparent;border:0;color:var(--kcal);font-weight:800}

form label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a0d11;color:var(--ink);font:inherit;color-scheme:dark}
input:focus,select:focus{outline:2px solid #3cf28a66;border-color:transparent}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

@keyframes fade{from{opacity:0;transform:translateY(6px)}}

// ---------- datas (Brasil, UTC-3 fixo, sem horário de verão) ----------
const TZ = '-03:00';
const pad = n => String(n).padStart(2, '0');
function hojeISO() {
  const d = new Date(Date.now() - 3 * 3600e3);
  return d.toISOString().slice(0, 10);
}
function addDias(iso, n) {
  const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
const inicioDia = iso => iso + 'T00:00:00' + TZ;
const fimDia = iso => addDias(iso, 1) + 'T00:00:00' + TZ;

  // horário atual, mas no dia selecionado (para registrar dias passados)

function horaAgora() { const d = new Date(Date.now() - 3 * 3600e3); return d.getUTCHours() + d.getUTCMinutes() / 60; }
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

  const d = new Date(iso + 'T12:00:00Z');
  const h = hojeISO();
  const rel = iso === h ? 'Hoje' : iso === addDias(h, -1) ? 'Ontem' : iso === addDias(h, 1) ? 'Amanhã' : null;
  const curto = pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1);
  return { d: (rel ? rel + ', ' : '') + curto, s: DIAS[d.getUTCDay()] };
}

  const semanas = Math.floor((new Date(iso) - new Date('2026-10-13')) / (7 * 864e5));

$('loginForm').onsubmit = async e => {

  const { error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  $('lMsg').textContent = error ? (error.message.includes('confirm') ? 'Email ainda não confirmado. Avise o VINEK.' : 'Email ou senha errados.') : '';
};
$('btnSignup').onclick = async () => {
  const email = $('lEmail').value.trim(), password = $('lPass').value;
  if (password.length < 8) { $('lMsg').textContent = 'Crie uma senha com pelo menos 8 caracteres no campo Senha.'; return; }
  $('lMsg').textContent = 'Criando acesso...';
  const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin } });
  if (error) { $('lMsg').textContent = 'Erro: ' + error.message; return; }
  $('lMsg').textContent = data.session ? '' : 'Acesso criado. Confirme no seu email e depois toque em Entrar.';
};
sb.auth.onAuthStateChange((_ev, session) => { session ? iniciar() : mostrarLogin(); });

function mostrarLogin() { $('app').classList.add('hidden'); $('fab').classList.add('hidden'); $('login').classList.remove('hidden'); }
let iniciado = false;
async function iniciar() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('fab').classList.remove('hidden');
  if (iniciado) return; iniciado = true;
  if (location.hash === '#chat') setTimeout(abrirChat, 300);
  const [m, f, r, rm] = await Promise.all([
    sb.from('metas').select('chave,valor'),
    sb.from('refeicoes_favoritas').select('*').order('id'),
    sb.from('recipientes').select('*').order('id'),
    sb.from('remedios').select('*').eq('ativo', true).order('id'),
  ]);
  if (m.error) { erro(m.error); return; }
  (m.data || []).forEach(x => S.metas[x.chave] = x.valor);
  S.fav = f.data || []; S.rec = r.data || []; S.rem = rm.data || [];
  if ('serviceWorker' in navigator && 'PushManager' in window) await checarPush();
  render();
}

$('prev').innerHTML = ic('chevron-left'); $('next').innerHTML = ic('chevron-right');
const NAV = { inicio: ['house', 'Início'], registros: ['zap', 'Registrar'], treino: ['dumbbell', 'Treino'], check: ['list-checks', 'Check'], mais: ['layout-grid', 'Mais'] };
const navTab = t => NAV[t] ? t : 'mais';
function marcarNav() { document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === navTab(S.tab))); }
document.querySelectorAll('nav button').forEach(b => { b.innerHTML = ic(NAV[b.dataset.tab][0]) + NAV[b.dataset.tab][1]; });
marcarNav();

function setDia(iso) { S.dia = iso; vibrar(); render(); }
$('prev').onclick = () => setDia(addDias(S.dia, -1));
$('next').onclick = () => setDia(addDias(S.dia, 1));

// arrastar para os lados também troca o dia
let tx = null, ty = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx == null || $('app').classList.contains('hidden')) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 90 && Math.abs(dx) > 2 * Math.abs(dy)) setDia(addDias(S.dia, dx > 0 ? -1 : 1));

// ---------- dados do dia ----------
async function carregarDia(iso) {
  const ini = inicioDia(iso), fim = fimDia(iso);
  // nota ao vivo: recalcula hoje e ontem antes de ler (mesma função do check-in)
  if (S.tab === 'inicio' && iso <= hojeISO() && iso >= addDias(hojeISO(), -1)) {
    try { await sb.rpc('calcular_nota_dia', { p_data: iso }); } catch (e) {}
  }
  const q = await Promise.all([
    sb.from('refeicoes').select('*').gte('data_hora', ini).lt('data_hora', fim).order('data_hora'),
    sb.from('agua_log').select('*').gte('data_hora', ini).lt('data_hora', fim).order('data_hora'),
    sb.from('remedios_log').select('*').or(`and(horario_previsto.gte.${ini},horario_previsto.lt.${fim}),and(horario_previsto.is.null,tomado_em.gte.${ini},tomado_em.lt.${fim})`),
    sb.from('plano_treinos').select('*').eq('data', iso).maybeSingle(),
    sb.from('cardio').select('*').eq('data', iso),
    sb.from('treinos').select('*').eq('data', iso),
    sb.from('sono').select('*').eq('data', iso).maybeSingle(),
    sb.from('diario').select('*').gte('data', addDias(iso, -6)).lte('data', iso).order('data'),
    sb.from('notas').select('*').eq('concluido', false).in('tipo', ['tarefa', 'lembrete', 'ajuste_casa']).order('prazo', { nullsFirst: false }),
    sb.from('casa_tarefas').select('*').eq('ativo', true).lte('proxima', iso).order('proxima'),
    sb.from('plano_refeicoes').select('*').eq('data', iso).order('id'),
  ]);
  const bad = q.find(x => x.error); if (bad) throw bad.error;
  const [ref, agua, remlog, plano, cardio, treinos, sono, semana, notas, casa, planoRef] = q.map(x => x.data);
  const diario = semana.find(d => d.data === iso) || null;
  let seq = null;
  if (S.tab === 'inicio' && iso <= hojeISO()) { const r = await sb.rpc('app_sequencias', { p_data: iso }); seq = r.data || null; }
  const X = { ref, agua, remlog, plano, cardio, treinos, sono, diario, semana, notas, casa, planoRef, seq };
  if (S.tab === 'treino' && !S.midia) { const r = await sb.from('exercicios_midia').select('*'); S.midia = r.data || []; }
  if (S.tab === 'corpo') {
    const [p, m] = await Promise.all([sb.from('peso').select('*').lte('data', iso).order('data').order('id'), sb.from('medidas_corporais').select('*').lte('data', iso).order('data').order('id')]);
    X.pesos = p.data || []; X.medidas = m.data || [];
  }
  if (S.tab === 'inicio') {
    const [u, f] = await Promise.all([sb.from('peso').select('peso_kg').lte('data', iso).order('data', { ascending: false }).order('id', { ascending: false }).limit(1), sb.from('peso').select('peso_kg').order('data').order('id').limit(1)]);
    X.pesoUlt = u.data && u.data[0] && f.data && f.data[0] ? { ult: +u.data[0].peso_kg, ini: +f.data[0].peso_kg } : null;
  }
  if (S.tab === 'registros' || S.tab === 'despensa') await carregarDespensa();
  if (S.tab === 'evolucao') X.evo = await carregarEvo(iso);
  if (S.tab === 'financas') X.fin = await carregarFin(iso);
  if (S.tab === 'casa') X.casaT = await carregarCasa(iso);
  if (S.tab === 'youtube') X.yt = await carregarYt(iso);
  if (!['inicio', 'check'].includes(S.tab)) { const r = await sb.from('app_resumos').select('*'); S.resumos = r.data || []; }
  if (S.tab === 'sono') { const r = await sb.from('sono').select('*').gte('data', addDias(iso, -13)).lte('data', iso).order('data'); X.sonos = r.data || []; }
  return X;
}
function somaMacros(ref) {
  const t = { kcal: 0, p: 0, c: 0, g: 0 };
  ref.forEach(r => { t.kcal += +r.kcal || 0; t.p += +r.proteina_g || 0; t.c += +r.carbo_g || 0; t.g += +r.gordura_g || 0; });
  return t;
}
const metasMacro = () => ({ kcal: metaNum('kcal_meta_dia', 2070), p: metaNum('proteina_g_dia', 120), c: metaNum('carbo_g_dia', 251), g: metaNum('gordura_g_dia', 65) });

// ---------- render ----------
let renderId = 0;
async function render() {
  const r = rotuloData(S.dia);
  $('dLabel').textContent = r.d; $('dSub').textContent = r.s; $('dPick').value = S.dia;
  $('hoje').classList.toggle('hidden', S.dia === hojeISO());
  const id = ++renderId;
  if (!view.innerHTML) view.innerHTML = '<p class="muted">Carregando...</p>';
  try {
    const D = await carregarDia(S.dia);
    if (id !== renderId) return;
    view.innerHTML = '<div class="fade">' + ({ inicio: telaInicio, nutricao: telaNutricao, remedios: telaRemedios, check: telaCheck, treino: telaTreino, corpo: telaCorpo, sono: telaSono, financas: telaFinancas, casa: telaCasa, youtube: telaYoutube, registros: telaRegistros, despensa: telaDespensa, evolucao: telaEvolucao })[S.tab](D) + '</div>';
    animar();
    ligarEventos(D);
    desenharPrato();
    const nb = document.querySelector('nav button[data-tab="check"]'), pc = S.dia <= hojeISO() ? pendentesCheck(D) : 0;
    let dot = nb.querySelector('.dot'); if (!dot) { dot = document.createElement('span'); dot.className = 'dot'; nb.appendChild(dot); }
    dot.textContent = pc; dot.classList.toggle('hidden', !pc || horaAgora() < 17 && S.dia === hojeISO());
  } catch (e) { erro(e); }
}
// anéis e barras começam vazios e enchem depois de desenhados
function animar() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    view.querySelectorAll('[data-off]').forEach(c => c.style.strokeDashoffset = c.dataset.off);
    view.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w);
    view.querySelectorAll('[data-h]').forEach(b => b.style.height = b.dataset.h);
  }));
}

// anel: r = raio, frac = 0..1+, cor
function anel(cx, r, w, frac, cor) {
  const C = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<circle cx="${cx}" cy="${cx}" r="${r}" stroke="${cor}" stroke-opacity=".16" stroke-width="${w}"/>
    <circle class="ring-fg" cx="${cx}" cy="${cx}" r="${r}" stroke="${cor}" stroke-width="${w}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - f)}"
      transform="rotate(-90 ${cx} ${cx})" ${f > 0 ? `style="filter:drop-shadow(0 0 6px ${cor}66)"` : ''}/>`;
}
function slim(label, val, meta, un, cor) {
  const over = val > meta;
  return `<div class="slim"><div class="top"><span class="muted">${label}</span><span class="num"><b>${fmt(val)}</b> <span class="muted">/ ${fmt(meta)} ${un}</span></span></div>
    <div class="track"><i style="background:${over ? 'var(--bad)' : cor}" data-w="${Math.min(100, val / meta * 100)}%"></i></div></div>`;
}
function totalAgua(D) { return D.agua.reduce((s, a) => s + (+a.ml || 0), 0); }

function statusRemedios(D) {
  // uma linha por horário previsto de cada remédio
  const linhas = [];
  S.rem.forEach(rm => {
    const hs = (rm.horarios && rm.horarios.length) ? rm.horarios : [null];
    const logs = D.remlog.filter(l => l.remedio_id === rm.id).sort((a, b) => (a.horario_previsto || a.tomado_em).localeCompare(b.horario_previsto || b.tomado_em));
    hs.forEach((h, i) => linhas.push({ rm, h: h ? h.slice(0, 5) : null, log: logs[i] || null }));
  });
  return linhas;
}
function chipStatus(log) {
  if (!log) return '<span class="chip">pendente</span>';
  return `<span class="chip ${log.status === 'tomado' ? 'ok' : 'warn'}">${log.status}</span>`;
}

function telaInicio(D) {
  const t = somaMacros(D.ref), M = metasMacro();
  const agua = totalAgua(D), mAgua = metaAgua(S.dia);
  const bikeFeita = D.cardio.find(c => c.modalidade === 'bike');
  const caliFeita = D.treinos.length > 0;
  const plano = D.plano;
  const rem = statusRemedios(D);
  const pend = D.notas.filter(n => !n.prazo || n.prazo.slice(0, 10) <= S.dia);
  const kcalCor = t.kcal > M.kcal ? 'var(--bad)' : 'var(--kcal)';
  let html = painel(D) + cardNota(D) + cardSeq(D);

  // tarefas
  const nT = pend.length + D.casa.length;
  html += `<div class="card"><h2><span class="t">${ic('list-checks')} Tarefas</span><small>${nT} pendente${nT === 1 ? '' : 's'}</small></h2>
    ${pend.map(n => `<div class="row"><button class="check" data-done="${n.id}" aria-label="Concluir">${ic('circle-check')}</button>
      <div class="grow"><div>${esc(n.texto.length > 90 ? n.texto.slice(0, 90) + '…' : n.texto)}</div>${n.prazo ? `<div class="muted">${n.prazo.slice(0, 10) < S.dia ? '<span style="color:var(--bad)">atrasada</span> · ' : ''}até ${n.prazo.slice(8, 10)}/${n.prazo.slice(5, 7)}</div>` : ''}</div></div>`).join('')}
    ${D.casa.map(c => `<div class="row"><button class="check" data-casadone="${c.id}" aria-label="Feito">${ic('circle-check')}</button>
      <div class="grow"><div>${esc(c.nome)}</div><div class="muted">casa · ${esc(c.quando || c.frequencia || '')}</div></div></div>`).join('')}
    ${nT ? '' : '<p class="muted">Nada pendente. 👊</p>'}</div>`;

  // treino
  let tr = '';
  if ((plano && plano.bike) || bikeFeita) {
    const alvo = plano && plano.bike ? `${fmt(plano.bike.minutos)} min${plano.bike.km_alvo ? ' · alvo ' + fmt(plano.bike.km_alvo, 1) + ' km' : ''}` : '';
    tr += `<div class="row"><div class="tile" style="background:#3cf28a1a;color:var(--kcal)">${ic('bike')}</div>
      <div class="grow"><div class="title">Bike</div><div class="muted">${alvo || 'registrada'}</div></div>
      ${bikeFeita ? `<span class="chip ok">${fmt(bikeFeita.km, 2)} km</span>` : '<span class="chip">a fazer</span>'}</div>`;
  }
  const cal = plano && Array.isArray(plano.calistenia) ? plano.calistenia : [];
  if (cal.length || caliFeita) {
    tr += `<div class="row"><div class="tile" style="background:#ff7a2f1a;color:var(--prot)">${ic('dumbbell')}</div>
      <div class="grow"><div class="title">Calistenia</div><div class="muted">${cal.map(e => esc(e.exercicio) + ' ' + e.series + '×' + e.reps).join(' · ') || 'registrada'}</div></div>
      ${caliFeita ? '<span class="chip ok">feita</span>' : '<span class="chip">a fazer</span>'}</div>`;
  }
  html += `<div class="card tap" data-go="treino"><h2><span class="t">${ic('zap')} Treino</span><small>›</small></h2>${tr || '<p class="muted">Sem treino planejado nem registrado.</p>'}</div>`;

  // remédios
  html += `<div class="card tap" data-go="remedios"><h2><span class="t">${ic('pill')} Remédios</span><small>${rem.filter(l => l.log && l.log.status === 'tomado').length}/${rem.length}</small></h2>
    ${rem.map(l => `<div class="row"><div class="grow"><span class="title">${esc(l.rm.nome)}</span> ${l.h ? `<span class="muted num">${l.h}</span>` : ''}</div>${chipStatus(l.log)}</div>`).join('')}</div>`;

  // sono
  const s = D.sono;
  html += `<div class="card"><h2><span class="t">${ic('moon')} Sono</span></h2>${s ? `<div class="row"><div class="grow"><span style="font-size:28px;font-weight:900">${fmt(s.horas, 1)}</span> <span class="muted">horas</span></div>
    <span class="chip ${s.qualidade >= 4 ? 'ok' : s.qualidade <= 2 ? 'bad' : 'warn'}">qualidade ${s.qualidade ?? '—'}/5</span></div>` : '<p class="muted">Sem registro desta noite.</p>'}</div>`;
  return html;
}

// ---------- nota do dia ----------
const corNota = n => n >= 8 ? '#3cf28a' : n >= 6 ? '#ffd23f' : '#ff4d5e';
const palavraNota = n => n >= 9 ? 'Excelente' : n >= 8 ? 'Muito bom' : n >= 7 ? 'Bom' : n >= 5 ? 'Regular' : 'Fraco';
function segundaDe(iso) { const d = new Date(iso + 'T12:00:00Z'); return addDias(iso, -((d.getUTCDay() + 6) % 7)); }
function cardNota(D) {
  const nota = D.diario && D.diario.nota_final != null ? +D.diario.nota_final : null;
  const ontem = D.semana.find(d => d.data === addDias(S.dia, -1));
  const seg = segundaDe(S.dia);
  const daSemana = D.semana.filter(d => d.data >= seg && d.nota_final != null);
  const media = daSemana.length ? daSemana.reduce((s, d) => s + +d.nota_final, 0) / daSemana.length : null;
  if (nota == null && !D.semana.some(d => d.nota_final != null)) return '';
  const cor = nota == null ? '#5b6472' : corNota(nota);
  // medidor em meia-lua: 0 a 10
  const R = 90, L = Math.PI * R, f = nota == null ? 0 : Math.max(0, Math.min(1, nota / 10));
  const delta = nota != null && ontem && ontem.nota_final != null ? nota - ontem.nota_final : null;
  const dias = [];
  for (let i = 6; i >= 0; i--) { const dd = addDias(S.dia, -i); dias.push({ dd, r: D.semana.find(x => x.data === dd) }); }
  const cats = D.diario && D.diario.notas_categorias ? Object.entries(D.diario.notas_categorias).filter(([, v]) => v && v.nota != null).sort((a, b) => b[1].peso - a[1].peso) : [];
  return `<div class="card score" style="--glow:${cor}26">
    <h2><span class="t">${ic('trophy')} Nota do dia</span><small>${S.dia === hojeISO() ? 'parcial, atualiza ao vivo' : 'final'}</small></h2>
    <svg class="gauge" viewBox="0 0 230 130">
      <path d="M25 115 A90 90 0 0 1 205 115" fill="none" stroke="#1a2029" stroke-width="16" stroke-linecap="round"/>
      <path class="ring-fg" d="M25 115 A90 90 0 0 1 205 115" fill="none" stroke="${cor}" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${L}" stroke-dashoffset="${L}" data-off="${L * (1 - f)}" style="filter:drop-shadow(0 0 10px ${cor}88)"/>
      <text x="115" y="108" text-anchor="middle" class="n" fill="${cor}">${nota == null ? '—' : fmt(nota, 1)}</text>
    </svg>
    <div class="lbl" style="color:${cor}">${nota == null ? 'sem nota ainda' : palavraNota(nota)}</div>
    <div class="stats">
      <div class="stat"><div class="k">Média da semana</div><div class="v num" style="color:${media == null ? 'inherit' : corNota(media)}">${media == null ? '—' : fmt(media, 1)}</div></div>
      <div class="stat"><div class="k">Vs ontem</div><div class="v num" style="color:${delta == null ? 'inherit' : delta >= 0 ? 'var(--ok)' : 'var(--bad)'}">${delta == null ? '—' : (delta >= 0 ? '▲ ' : '▼ ') + fmt(Math.abs(delta), 1)}</div></div>
    </div>
    <div class="spark">${dias.map(({ dd, r }) => {
      const v = r && r.nota_final != null ? +r.nota_final : null;
      const wd = 'DSTQQSS'[new Date(dd + 'T12:00:00Z').getUTCDay()];
      return `<div class="${dd === S.dia ? 'cur' : ''}"><em>${v == null ? '' : fmt(v, 1)}</em><i style="height:0;background:${v == null ? '#1a2029' : corNota(v)}${dd === S.dia ? '' : '99'}" data-h="${v == null ? 4 : Math.max(10, (v - 4) / 6 * 100)}%"></i><span>${wd}</span></div>`;
    }).join('')}</div>
    ${cats.length ? `<div class="cats">${cats.map(([k, v]) => `<div class="c"><span class="muted">${esc(k)}</span>
      <div class="track" style="height:6px"><i style="background:${corNota(+v.nota)}" data-w="${+v.nota * 10}%"></i></div><b style="color:${corNota(+v.nota)}">${fmt(+v.nota, 1)}</b></div>`).join('')}</div>` : ''}
  </div>`;
}

// ---------- sequências ----------
function cardSeq(D) {
  if (!D.seq) return '';
  const it = [['bike', 'Bike', 'bike', '#3cf28a', 'dias úteis'], ['agua', 'Água', 'droplet', '#31c8ff', 'dias'], ['prot', 'Proteína', 'beef', '#ff7a2f', 'dias'], ['rem', 'Remédios', 'pill', '#c86bff', 'dias']];
  const h = D.seq.hoje || {};
  return `<div class="card"><h2><span class="t">${ic('flame')} Sequências</span><small>${S.dia === hojeISO() ? 'acende quando bater hoje' : ''}</small></h2>
    <div class="seq">${it.map(([k, nome, icn, cor]) => {
      const n = D.seq[k] || 0, ok = h[k];
      return `<div class="sq ${ok ? 'on' : ''}" style="--c:${cor}"><div class="f">${ic('flame')}</div><div class="n num">${n}</div><div class="l">${nome}</div></div>`;
    }).join('')}</div></div>`;
}

const T = { fim: 0, ini: 0, livre: false, id: null };

function bip() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {}

}
function mostrarTimer() {
  $('timer').classList.remove('hidden'); clearInterval(T.id);
  const tick = () => {
    const ms = T.livre ? Date.now() - T.ini : T.fim - Date.now();
    if (!T.livre && ms <= 0) { $('tmV').textContent = '0:00'; bip(); toast('⏱️ Descanso acabou, bora!'); pararTimer(); return; }
    const s = Math.ceil(Math.abs(ms) / 1000) - (T.livre ? 1 : 0);
    $('tmV').textContent = Math.floor(s / 60) + ':' + pad(s % 60);

function graficoPeso(P, alvo) {
  if (P.length < 2) return '';
  const W = 320, H = 150, pl = 30, pr = 10, pt = 10, pb = 22;
  const xs = P.map(p => new Date(p.data).getTime()), x0 = xs[0], x1 = Math.max(xs[xs.length - 1], x0 + 864e5);
  const ys = P.map(p => +p.peso_kg), y0 = Math.min(alvo, ...ys) - 1, y1 = Math.max(...ys) + 1;
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (y1 - v) / (y1 - y0) * (H - pt - pb);
  const linha = P.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  const ticks = [y0 + 1, (y0 + y1) / 2, y1 - 1].map(v => Math.round(v));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:14px">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1a2029"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" fill="#5b6472" font-size="10">${v}</text>`).join('')}
    <line x1="${pl}" x2="${W - pr}" y1="${Y(alvo)}" y2="${Y(alvo)}" stroke="#3cf28a" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${W - pr}" y="${Y(alvo) - 5}" text-anchor="end" fill="#3cf28a" font-size="10" font-weight="700">meta ${alvo}</text>
    <path d="${linha}" fill="none" stroke="#31c8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #31c8ff88)"/>
    ${P.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="${p.oficial ? 4.5 : 3}" fill="${p.oficial ? '#31c8ff' : '#0f1318'}" stroke="#31c8ff" stroke-width="2"/>`).join('')}
    <text x="${X(xs[0])}" y="${H - 6}" fill="#5b6472" font-size="10">${P[0].data.slice(8, 10)}/${P[0].data.slice(5, 7)}</text>
    <text x="${X(xs[xs.length - 1])}" y="${H - 6}" text-anchor="end" fill="#5b6472" font-size="10">${P[P.length - 1].data.slice(8, 10)}/${P[P.length - 1].data.slice(5, 7)}</text>
  </svg>`;
}

function telaSono(D) {
  const L = D.sonos || [];
  const dias = []; for (let i = 13; i >= 0; i--) { const dd = addDias(S.dia, -i); dias.push({ dd, s: L.find(x => x.data === dd) }); }
  const com = L.filter(s => s.horas != null && s.data > addDias(S.dia, -7));
  const media = com.length ? com.reduce((a, s) => a + +s.horas, 0) / com.length : null;
  const mq = com.filter(s => s.qualidade).length ? com.reduce((a, s) => a + (+s.qualidade || 0), 0) / com.filter(s => s.qualidade).length : null;
  const max = 10;
  let html = `<div class="card score" style="--glow:#c86bff22"><h2><span class="t">${ic('moon')} Sono</span><small>últimos 14 dias</small></h2>
    <div class="stats" style="margin-top:0">
      <div class="stat"><div class="k">Média 7 dias</div><div class="v num" style="color:${media == null ? 'inherit' : media >= 7 ? 'var(--ok)' : media >= 6 ? 'var(--carb)' : 'var(--bad)'}">${media == null ? '—' : fmt(media, 1) + ' h'}</div></div>
      <div class="stat"><div class="k">Qualidade média</div><div class="v num">${mq == null ? '—' : fmt(mq, 1) + '/5'}</div></div></div>
    <div class="spark" style="height:130px;position:relative">${dias.map(({ dd, s }) => {
      const h = s && s.horas != null ? +s.horas : null;
      const cor = h == null ? '#1a2029' : h >= 7 ? '#3cf28a' : h >= 6 ? '#ffd23f' : '#ff4d5e';
      return `<div class="${dd === S.dia ? 'cur' : ''}"><em>${h == null ? '' : fmt(h, 1)}</em><i style="height:0;background:${cor}" data-h="${h == null ? 3 : h / max * 100}%"></i><span>${'DSTQQSS'[new Date(dd + 'T12:00:00Z').getUTCDay()]}</span></div>`;
    }).join('')}</div>
    <p class="muted">Verde: 7h ou mais. Fim de semana não tem horário fixo.</p></div>`;
  const s = D.sono;
  html += `<div class="card"><h2><span class="t">${ic('bed')} Noite de ${rotuloData(S.dia).d.toLowerCase()}</span></h2>${s
    ? `<div class="row"><div class="grow"><span style="font-size:28px;font-weight:900">${fmt(s.horas, 1)}</span> <span class="muted">horas</span>${s.lembrou_sonho ? '<div class="muted">lembrou do sonho' + (s.sonho_descricao ? ': ' + esc(s.sonho_descricao) : '') + '</div>' : ''}</div><span class="chip ${s.qualidade >= 4 ? 'ok' : s.qualidade <= 2 ? 'bad' : 'warn'}">qualidade ${s.qualidade ?? '—'}/5</span></div>`
    : '<p class="muted">Sem registro. Registre pela aba Check (horas e qualidade em 2 toques).</p>'}</div>`;
  return html;
}

function proxVenc(dia, iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const mk = (yy, mm) => { const ult = new Date(Date.UTC(yy, mm, 0)).getUTCDate(); return `${yy}-${pad(mm)}-${pad(Math.min(dia, ult))}`; };
  let v = mk(y, m); if (v < iso) v = m === 12 ? mk(y + 1, 1) : mk(y, m + 1);

}

async function carregarFin(iso) {

  const q = await Promise.all([

    sb.from('fin_categorias').select('*').eq('ativa', true).order('id'),

  ]);

const PRATO_KEY = 'vinek-prato';

function gravarPrato(p) { try { localStorage.setItem(PRATO_KEY, JSON.stringify(p)); } catch (e) {} desenharPrato(); }
const ehPitada = p => p.porcao_g != null && +p.porcao_g < 2 || +p.kcal_100g === 0;
const nomeCurto = n => n.replace(/\s+\d+([.,]\d+)?\s?(g|kg|ml|l|un)\b.*$/i, '').replace(/\s*\((granel|congelado)\)/i, '').slice(0, 28);

}

async function salvarPrato(itens, tipo, hora, limpar) {
  vibrar();

  const dh = hora ? `${S.dia}T${hora}:00${TZ}` : agoraNoDia(S.dia);
  let { data, error } = await sb.rpc('app_registrar_refeicao', { p_data_hora: dh, p_tipo: tipo, p_itens: itens.map(i => ({ produto_id: i.produto_id, g: i.g, estado: i.estado })) });
  if (error && /function|schema cache/i.test(error.message || '')) {
    // banco ainda sem a função: grava a refeição calculada aqui, sem baixa na despensa
    const t = { kcal: 0, p: 0, c: 0, g: 0 };
    itens.forEach(i => { const d = (S.desp || []).find(x => x.produto_id === i.produto_id); if (!d) return; const n = nutri(d.fin_produtos, i.g, i.estado); t.kcal += n.kcal; t.p += n.p; t.c += n.c; t.g += n.g; });
    const r1 = v => Math.round(v * 10) / 10;
    const r = await sb.from('refeicoes').insert({ data_hora: dh, tipo, descricao: itens.map(i => `${fmt(i.g)} g ${i.nome}${i.estado === 'pronto' ? ' (pronto)' : ''}`).join(' + '),
      kcal: r1(t.kcal), proteina_g: r1(t.p), carbo_g: r1(t.c), gordura_g: r1(t.g), itens: itens.map(i => ({ produto_id: i.produto_id, item: i.nome, g: i.g, estado: i.estado })),
      observacoes: 'registrado pelo app (despensa: dar baixa)' }).select('id').single();
    if (r.error) return erro(r.error);
    data = r.data.id; error = null;
  }
  if (error) return erro(error);
  if (limpar) gravarPrato([]);
  toast(`✓ ${TIPOS[tipo]} · ${fmt(itens.reduce((a, i) => a + i.kcal, 0))} kcal · baixa na despensa`, async () => { const r = await sb.rpc('app_apagar_refeicao', { p_id: data }); if (r.error) await sb.from('refeicoes').delete().eq('id', data); });
  render();
}

async function carregarEvo(iso) {
  const ini = addDias(iso, -89);
  const q = await Promise.all([
    sb.from('diario').select('data,nota_final').gte('data', ini).lte('data', iso).order('data'),
    sb.from('peso').select('data,peso_kg,oficial').lte('data', iso).order('data').order('id'),
    sb.from('refeicoes').select('data_hora,kcal,proteina_g').gte('data_hora', inicioDia(ini)).lt('data_hora', fimDia(iso)),
    sb.from('agua_log').select('data_hora,ml').gte('data_hora', inicioDia(ini)).lt('data_hora', fimDia(iso)),
    sb.from('cardio').select('data,km,minutos,modalidade').gte('data', ini).lte('data', iso),
    sb.from('treinos').select('data').gte('data', ini).lte('data', iso),
    sb.from('fin_transacoes').select('data,valor,natureza').eq('natureza', 'despesa').gte('data', addDias(iso.slice(0, 8) + '01', -150).slice(0, 8) + '01').lte('data', iso),
  ]);
  const bad = q.find(x => x.error); if (bad) throw bad.error;
  const [diario, pesos, ref, agua, cardio, treinos, gastos] = q.map(x => x.data);
  const dia = ts => new Date(new Date(ts).getTime() - 3 * 3600e3).toISOString().slice(0, 10);
  const porDia = {};
  const D = k => porDia[k] = porDia[k] || { kcal: 0, p: 0, agua: 0, bike: false, km: 0, cali: false, nota: null };
  ref.forEach(r => { const o = D(dia(r.data_hora)); o.kcal += +r.kcal || 0; o.p += +r.proteina_g || 0; });

function barras(dias, val, cor, max, fmtv, meta) {

function conquistas(E) {

  const diasBike = dias.filter(d => E.porDia[d].bike).length, km = dias.reduce((a, d) => a + E.porDia[d].km, 0);

    ['target', `Meta ${alvo} kg`, ult ? `faltam ${fmt(Math.max(0, ult - alvo), 1)} kg` : '', ult != null && ult <= alvo, ini ? perdeu / (ini - alvo) : 0],

function resumoNutri(t) {
  const M = metasMacro();
  const fk = M.kcal - t.kcal, fp = M.p - t.p;
  if (!t.kcal) return 'Nada registrado ainda neste dia.';
  if (fk < 0) return `Passou <b>${fmt(-fk)} kcal</b> da meta. Daqui pra frente, só proteína magra e salada. Nada gorduroso à noite (refluxo).`;
  if (fp > 0) return `Faltam <b>${fmt(fp)} g de proteína</b> em ${fmt(fk)} kcal. Priorize frango, atum, ovo ou iogurte na próxima refeição.`;
  return `Proteína batida! Restam ${fmt(fk)} kcal. Se comer de novo, algo leve.`;
}
const nomeRec = id => (S.rec.find(r => r.id === id) || {}).apelido;

async function registrarFav(f, btn) {
  let qtd = 1, gramas = null;
  if (!QUICK_FAV.includes(f.apelido)) {
    const resp = prompt(por100(f) ? `Quantos gramas de ${f.apelido} (pronto)?` : `Quantas unidades de ${f.apelido}?`, por100(f) ? '150' : '1');
    if (!resp) return;
    const n = parseFloat(resp.replace(',', '.')); if (!(n > 0)) return;
    if (por100(f)) { gramas = n; qtd = n / 100; } else qtd = n;
  }
  vibrar(); btn && btn.classList.add('pop');
  const h = horaAgora();
  let tipo = tipoPorHora(h), desc;
  if (f.apelido === 'caneca de café') { tipo = 'bebida'; desc = '1 caneca de café preto com adoçante'; }
  else if (['rosquinha', 'bala'].includes(f.apelido)) { tipo = 'lanche'; desc = `Beliscar: ${qtd} ${f.apelido}${qtd > 1 ? 's' : ''}`; }
  else if (f.apelido === 'sanduba') { tipo = 'cafe'; desc = 'Sanduba (favorita)'; }
  else desc = gramas ? `${gramas} g de ${f.apelido} (favorita)` : `${qtd} ${f.apelido} (favorita)`;
  const k = v => v == null ? null : Math.round(v * qtd * 10) / 10;
  const row = {
    data_hora: agoraNoDia(S.dia), tipo, descricao: desc, favorita_id: f.id,
    kcal: k(f.kcal), proteina_g: k(f.proteina_g), carbo_g: k(f.carbo_g), gordura_g: k(f.gordura_g),
    itens: (f.itens || []).map(i => ({ ...i, qtd_favorita: qtd })), observacoes: 'registrado pelo app'
  };
  const { data, error } = await sb.from('refeicoes').insert(row).select('id').single();
  if (error) return erro(error);
  toast(`✓ ${f.apelido} · ${fmt(row.kcal)} kcal`, () => sb.from('refeicoes').delete().eq('id', data.id));
  render();
}

    toast(`✓ Repetido · ${fmt(r.kcal)} kcal`, () => sb.from('refeicoes').delete().eq('id', d.id));
    render();
  });
}
$('shClose').onclick = () => $('sheet').classList.add('hidden');
$('tmStop').onclick = pararTimer;
$('tmMais').onclick = () => { if (T.livre) return; T.fim += 15000; vibrar(); };
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.add('hidden'); };

// ---------- Remédios ----------
function telaRemedios(D) {
  const linhas = statusRemedios(D);
  let html = cardEsp('remedios', 'DOUTOR', resumoDoutor(), 'doc');
  html += `<div class="card"><h2><span class="t">${ic('pill')} Doses do dia</span><small>${linhas.filter(l => l.log && l.log.status === 'tomado').length}/${linhas.length} tomadas</small></h2>
  ${linhas.map((l, i) => `<div class="row">
    <div class="tile" style="background:${l.log && l.log.status === 'tomado' ? '#3cf28a1f' : '#c86bff1a'};color:${l.log && l.log.status === 'tomado' ? 'var(--ok)' : 'var(--gord)'}">${ic(l.log && l.log.status === 'tomado' ? 'circle-check' : 'pill')}</div>
    <div class="grow"><div class="title">${esc(l.rm.nome)} ${l.h ? `<span class="muted num">${l.h}</span>` : ''}</div><div class="muted">${esc(l.rm.dose || '')}</div></div>
    ${l.log ? `<span class="chip ${l.log.status === 'tomado' ? 'ok' : 'warn'}">${l.log.status} ${horaLocal(l.log.tomado_em)}</span><button class="x" data-dellog="${l.log.id}" data-rem="${l.rm.id}" data-st="${l.log.status}" aria-label="Desfazer">${ic('x')}</button>`
      : `<div style="display:flex;gap:6px"><button class="btn small" data-tomar="${i}">Tomei</button><button class="btn small ghost" data-pular="${i}">Pulei</button></div>`}
  </div>`).join('')}</div>`;
  html += `<div class="card"><h2><span class="t">Estoque</span></h2>${S.rem.map(r => {
    const pct = Math.min(100, (r.estoque || 0) / 60 * 100), baixo = r.estoque != null && r.estoque <= 7;
    return `<div class="slim" style="margin-bottom:12px"><div class="top"><span>${esc(r.nome)}</span><span class="num"><b style="color:${baixo ? 'var(--bad)' : 'inherit'}">${r.estoque ?? '—'}</b> <span class="muted">${esc(r.unidade || '')}${baixo ? ' · comprar' : ''}</span></span></div>
      <div class="track"><i style="background:${baixo ? 'var(--bad)' : 'var(--gord)'}" data-w="${pct}%"></i></div></div>`;
  }).join('')}</div>`;
  return html;
}
function resumoDoutor() {
  const baixos = S.rem.filter(r => r.estoque != null && r.estoque <= 7);
  return baixos.length ? 'Estoque baixo: ' + baixos.map(r => `<b>${esc(r.nome)}</b> (${r.estoque})`).join(', ') + '. Compre antes de acabar.'
    : 'Estoques em dia. Tome cada dose no horário e marque aqui.';
}
async function registrarDose(l, status) {
  vibrar();
  const prev = l.h ? `${S.dia}T${l.h}:00${TZ}` : agoraNoDia(S.dia);
  const row = { remedio_id: l.rm.id, horario_previsto: prev, tomado_em: agoraNoDia(S.dia), status, observacoes: 'registrado pelo app' };
  const { data, error } = await sb.from('remedios_log').insert(row).select('id').single();
  if (error) return erro(error);
  if (status === 'tomado' && l.rm.estoque != null) {
    const novo = l.rm.estoque - 1;
    const u = await sb.from('remedios').update({ estoque: novo }).eq('id', l.rm.id);
    if (u.error) return erro(u.error);
    l.rm.estoque = novo;
  }
  toast(`✓ ${l.rm.nome}: ${status}`, () => desfazerDose(data.id, l.rm.id, status));
  render();
}
async function desfazerDose(logId, remId, status) {
  await sb.from('remedios_log').delete().eq('id', logId);
  if (status === 'tomado') {
    const r = S.rem.find(x => x.id === remId);
    if (r && r.estoque != null) { r.estoque += 1; await sb.from('remedios').update({ estoque: r.estoque }).eq('id', remId); }
  }
}

// ---------- eventos ----------
function ligarEventos(D) {
  view.querySelectorAll('[data-go]').forEach(el => el.onclick = e => {
    if (e.target.closest('button')) return;
    irPara(el.dataset.go);
  });
  view.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => registrarFav(S.fav.find(f => f.id == b.dataset.fav), b));
  view.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => registrarAgua(S.rec.find(r => r.id == b.dataset.rec), b));
  view.querySelectorAll('[data-delref]').forEach(b => b.onclick = async () => {
    if (!confirm('Apagar esta refeição?')) return;
    let { error } = await sb.rpc('app_apagar_refeicao', { p_id: +b.dataset.delref });
    if (error && /function|schema cache/i.test(error.message || '')) ({ error } = await sb.from('refeicoes').delete().eq('id', b.dataset.delref));
    error ? erro(error) : render();
  });
  view.querySelectorAll('[data-delagua]').forEach(b => b.onclick = async () => {

  });
  view.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    vibrar(); b.style.borderColor = 'var(--kcal)'; b.style.color = 'var(--kcal)';
    const id = b.dataset.done;
    const { error } = await sb.from('notas').update({ concluido: true }).eq('id', id);
    if (error) return erro(error);
    toast('✓ Tarefa concluída', () => sb.from('notas').update({ concluido: false }).eq('id', id));
    setTimeout(render, 350);
  });
  view.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => salvarCheck(b.dataset.ck, JSON.parse(b.dataset.v)));
  view.querySelectorAll('[data-multi]').forEach(b => b.onclick = () => {
    const c = CHECK.find(x => x.k === 'tipo_dia'); S.multi = S.multi || [...((D.diario || {}).tipo_dia || [])];
    const o = b.dataset.multi; S.multi = S.multi.includes(o) ? S.multi.filter(x => x !== o) : [...S.multi, o];

  });
  view.querySelectorAll('[data-savemulti]').forEach(b => b.onclick = () => {
    const outro = ($('ckOutro').value || '').trim().toLowerCase();
    const v = [...(S.multi || (D.diario || {}).tipo_dia || [])]; if (outro) v.push(outro);
    if (!v.length) return toast('Escolha pelo menos um');
    salvarCheck('tipo_dia', v);
  });
  view.querySelectorAll('[data-savenum]').forEach(b => b.onclick = () => {
    const v = parseInt(($('ck_' + b.dataset.savenum).value || '').replace(/\D/g, ''), 10);
    if (isNaN(v)) return toast('Digite um número'); salvarCheck(b.dataset.savenum, v);
  });
  view.querySelectorAll('[data-savetxt]').forEach(b => b.onclick = () => {
    const v = ($('ck_' + b.dataset.savetxt).value || '').trim(); if (v) salvarCheck(b.dataset.savetxt, v);
  });
  view.querySelectorAll('[data-sonoh]').forEach(b => b.onclick = () => { S.sonoH = +b.dataset.sonoh; $('sonoH').value = fmt(S.sonoH, 1); view.querySelectorAll('[data-sonoh]').forEach(x => x.classList.toggle('sel', x === b)); vibrar(); });
  view.querySelectorAll('[data-sonoq]').forEach(b => b.onclick = () => salvarSono(+b.dataset.sonoq));
  view.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => { S.edit.add(el.dataset.edit); render(); });
  const linhas = S.tab === 'remedios' ? statusRemedios(D) : [];
  view.querySelectorAll('[data-tomar]').forEach(b => b.onclick = () => registrarDose(linhas[b.dataset.tomar], 'tomado'));
  view.querySelectorAll('[data-pular]').forEach(b => b.onclick = () => registrarDose(linhas[b.dataset.pular], 'pulado'));
  view.querySelectorAll('[data-dellog]').forEach(b => b.onclick = async () => {
    if (!confirm('Desfazer este registro?')) return;
    await desfazerDose(+b.dataset.dellog, +b.dataset.rem, b.dataset.st); render();
  });
  const br = $('btnRepetir'); if (br) br.onclick = abrirRepetir;
  ligarFin(D); ligarCasa(D); ligarYt(D); ligarRegistros(); ligarDespensa(); ligarEvo();
  view.querySelectorAll('[data-pgo]').forEach(b => b.onclick = () => irPara(b.dataset.pgo));
  view.querySelectorAll('[data-besf]').forEach(b => b.onclick = () => salvarBike(+b.dataset.besf));
  view.querySelectorAll('[data-tesf]').forEach(b => b.onclick = () => salvarTreino(D, +b.dataset.tesf));
  view.querySelectorAll('[data-serie]').forEach(b => b.onclick = () => {
    const i = +b.dataset.serie, s = +b.dataset.s, p = lerProg();
    const novo = (p[i] || 0) > s ? s : s + 1; p[i] = novo; gravarProg(p); vibrar();
    b.parentNode.querySelectorAll('.sr').forEach((x, k) => x.classList.toggle('on', k < novo));
    const e = (D.plano.calistenia || [])[i];
    if (novo > s && e && novo < e.series) iniciarTimer(e.descanso_s || 60);
  });
  view.querySelectorAll('[data-timer]').forEach(b => b.onclick = () => { vibrar(); iniciarTimer(+b.dataset.timer); });
  view.querySelectorAll('[data-crono]').forEach(b => b.onclick = () => { vibrar(); iniciarCrono(); });
  if ($('pSalvar')) $('pSalvar').onclick = salvarPeso;
  if ($('mSalvar')) $('mSalvar').onclick = salvarMedidas;
  if ($('pushOn')) $('pushOn').onclick = ligarPush;
  if ($('pushOff')) $('pushOff').onclick = desligarPush;
  if ($('pushTeste')) $('pushTeste').onclick = testarPush;
  const fm = $('fManual');
  if (fm) fm.onsubmit = async e => {
    e.preventDefault(); vibrar();
    const num = id => { const v = $(id).value.trim().replace(',', '.'); return v === '' ? null : parseFloat(v); };
    const k = num('mK');
    const row = {
      data_hora: `${S.dia}T${$('mHora').value || '12:00'}:00${TZ}`, tipo: $('mTipo').value, descricao: $('mDesc').value.trim(),
      kcal: k, proteina_g: num('mP'), carbo_g: num('mC'), gordura_g: num('mG'),
      observacoes: k == null ? 'APP: calcular kcal e macros (registrado sem números)' : 'registrado pelo app'
    };
    const { data, error } = await sb.from('refeicoes').insert(row).select('id').single();
    if (error) return erro(error);
    toast(k == null ? '✓ Salvo. O VINEK calcula os números.' : `✓ Refeição salva · ${fmt(k)} kcal`, () => sb.from('refeicoes').delete().eq('id', data.id));
    render();
  };
}


// ---------- chat flutuante (registra por texto, áudio ou foto) ----------
Object.assign(ICONS, {
  'message-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <line x1="12" x2="12" y1="19" y2="22" />',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /> <circle cx="12" cy="13" r="3" />',
  send: '<path d="m22 2-7 20-4-9-9-4Z" /> <path d="M22 2 11 13" />',
  square: '<rect width="14" height="14" x="5" y="5" rx="2" />',
  'trash-2': '<path d="M3 6h18" /> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />',
});
const CH = { msgs: [], foto: null, rec: null, pedacos: [], enviando: false };
try { CH.msgs = JSON.parse(localStorage.getItem('vinek-chat') || '[]'); } catch (e) {}
const salvarChat = () => { try { localStorage.setItem('vinek-chat', JSON.stringify(CH.msgs.slice(-40).map(m => ({ ...m, img: null })))); } catch (e) {} };
$('fab').innerHTML = ic('message-circle'); $('chCam').innerHTML = ic('camera'); $('chAv').innerHTML = ic('sparkles');
$('chLimpa').innerHTML = ic('trash-2'); $('chX').innerHTML = ic('x');
$('chat').onclick = e => { if (e.target.id === 'chat') $('chX').onclick(); };
$('fab').onclick = abrirChat;
$('chX').onclick = () => { $('chat').classList.add('hidden'); if (location.hash === '#chat') history.replaceState(null, '', '#' + S.tab); };
$('chCam').onclick = () => $('chFile').click();
$('chLimpa').onclick = () => { if (CH.enviando) return; CH.msgs = []; salvarChat(); desenharChat(); };
const SUG = [
  ['droplet', 'var(--agua)', 'Água', 'Bebi a garrafa azul'],
  ['donut', 'var(--prot)', 'Beliscar', 'Comi 2 rosquinhas'],
  ['utensils', 'var(--kcal)', 'Refeição', 'Almocei 150 g de arroz pronto e 120 g de frango'],
  ['wallet', 'var(--carb)', 'Gasto', 'Gastei R$ 25 no mercado'],
  ['camera', 'var(--gord)', 'Notinha', ''],
  ['list-checks', '#1fb8ff', 'Tarefa', 'Me lembra de pagar o advogado dia 20'],
];
function abrirChat() {
  vibrar(); $('chat').classList.remove('hidden'); desenharChat();
  if (matchMedia('(min-width:700px)').matches) setTimeout(() => $('chTxt').focus(), 50);
}
function desenharChat() {
  const L = $('chLog');
  L.innerHTML = CH.msgs.length ? CH.msgs.map(m => `<div class="bl ${m.role === 'user' ? 'eu' : 'ai'}${m.erro ? ' err' : ''}${m.pens ? ' pens' : ''}">${m.img ? `<img src="${m.img}">` : ''}${m.tr ? `<div class="tr">🎤 ${esc(m.tr)}</div>` : ''}${esc(m.content)}${m.acoes?.length ? `<div class="ac">${m.acoes.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}</div>`).join('')
    : `<div class="chvz"><div class="chav">${ic('sparkles')}</div><h3>O que rolou?</h3><p>Escreva, mande um áudio ou a foto da notinha. Eu calculo e registro tudo sozinho.</p>
      <div class="chg">${SUG.map(([i, c, t, ex], n) => `<button data-sug="${n}" style="--c:${c}"><span>${ic(i)}</span><div>${t}<em>${ex ? esc(ex) : 'Foto do cupom'}</em></div></button>`).join('')}</div></div>`;
  L.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { const ex = SUG[+b.dataset.sug][3]; if (!ex) return $('chFile').click(); $('chTxt').value = ex; $('chTxt').oninput(); $('chTxt').focus(); });
  L.scrollTop = L.scrollHeight;
}
function botaoChat() {
  const temTexto = $('chTxt').value.trim() || CH.foto;
  const b = $('chMic');
  b.className = 'cb' + (CH.rec ? ' rec' : temTexto ? ' send' : '');
  b.innerHTML = ic(CH.rec ? 'square' : temTexto ? 'send' : 'mic');
  b.setAttribute('aria-label', CH.rec ? 'Parar e enviar' : temTexto ? 'Enviar' : 'Gravar áudio');
}
$('chTxt').oninput = () => { const t = $('chTxt'); t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; botaoChat(); };
$('chTxt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarChat({}); } };
$('chMic').onclick = () => CH.rec ? CH.rec.stop() : ($('chTxt').value.trim() || CH.foto) ? enviarChat({}) : gravarAudio();
botaoChat();

$('chFile').onchange = async () => {
  const f = $('chFile').files[0]; $('chFile').value = ''; if (!f) return;
  try {
    const img = await new Promise((ok, nok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nok; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.82);
    CH.foto = { b64: url.split(',')[1], url };
    $('chFoto').innerHTML = `<img src="${url}"><span class="grow">Foto pronta. Escreva algo (opcional) e envie.</span><button class="btn small ghost" id="chFotoX">Tirar</button>`;
    $('chFoto').classList.remove('hidden');
    $('chFotoX').onclick = () => { CH.foto = null; $('chFoto').classList.add('hidden'); botaoChat(); };
    botaoChat();
  } catch (e) { erro('Não consegui abrir a foto'); }
};

async function gravarAudio() {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Esse navegador não grava áudio.');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const tipo = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
    const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
    CH.pedacos = []; CH.rec = rec; vibrar(); botaoChat();
    $('chTxt').placeholder = 'Gravando... toque no quadrado para enviar';
    rec.ondataavailable = e => e.data.size && CH.pedacos.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); CH.rec = null; botaoChat();
      $('chTxt').placeholder = 'Comi, bebi, gastei...';
      const blob = new Blob(CH.pedacos, { type: rec.mimeType || tipo || 'audio/webm' });
      if (blob.size < 1500) return toast('Áudio muito curto.');
      const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
      enviarChat({ audio_b64: b64, audio_mime: blob.type });
    };
    rec.start();
    setTimeout(() => { if (CH.rec === rec) rec.stop(); }, 120000);
  } catch (e) { toast('Sem acesso ao microfone. Libere nas permissões do navegador.'); }
}

async function enviarChat(extra) {
  if (CH.enviando) return;
  const texto = $('chTxt').value.trim(), foto = CH.foto;
  if (!texto && !foto && !extra.audio_b64) return;
  CH.enviando = true; vibrar();
  const historico = CH.msgs.filter(m => !m.pens && !m.erro).slice(-6).map(m => ({ role: m.role, content: m.content }));
  CH.msgs.push({ role: 'user', content: texto || (extra.audio_b64 ? '🎤 áudio' : '📷 foto'), img: foto?.url || null });
  const pens = { role: 'assistant', content: extra.audio_b64 ? 'Ouvindo...' : foto ? 'Lendo a foto...' : 'Registrando...', pens: true };
  CH.msgs.push(pens);
  $('chTxt').value = ''; $('chTxt').style.height = 'auto'; CH.foto = null; $('chFoto').classList.add('hidden'); botaoChat(); desenharChat();
  const hoje = S.dia === hojeISO();
  const body = { texto, dia: S.dia, hora: hoje ? horaLocal(Date.now()) : '12:00', historico, ...extra,
    ...(foto ? { imagem_b64: foto.b64, imagem_mime: 'image/jpeg' } : {}) };
  let r;
  try {
    const { data: ss } = await sb.auth.getSession();
    const resp = await fetch(SB_URL + '/functions/v1/chat', { method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + ss.session?.access_token }, body: JSON.stringify(body) });
    r = await resp.json().catch(() => ({ erro: 'resposta inválida (' + resp.status + ')' }));
  } catch (e) { r = { erro: 'sem conexão' }; }
  CH.msgs.splice(CH.msgs.indexOf(pens), 1);
  if (extra.audio_b64 && r.transcricao) CH.msgs[CH.msgs.length - 1].content = '🎤 ' + r.transcricao;
  CH.msgs.push(r.erro && !r.acoes?.length
    ? { role: 'assistant', content: 'Não deu: ' + r.erro, erro: true }
    : { role: 'assistant', content: r.resposta || r.erro || 'Feito.', acoes: r.acoes || [] });
  CH.enviando = false; salvarChat(); desenharChat();
  if (r.acoes?.length) { vibrar(); render(); }
}

// recarrega quando o app volta para a tela (ex.: depois de registrar pelo chat)
document.addEventListener('visibilitychange', () => { if (!document.hidden && iniciado) render(); });

(async () => {
  const { data } = await sb.auth.getSession();
  data.session ? iniciar() : mostrarLogin();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
