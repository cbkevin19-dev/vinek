<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VINEK</title>
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VINEK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14; --card:#151B23; --card2:#0B0F14; --line:#232B36; --line2:#1C232D; --ink:#E8EDF2; --soft:#C5CED8; --muted:#9AA6B2; --dim:#5B6673;
  --kcal:#3DDC84; --prot:#FF9F43; --carb:#FFD43B; --gord:#B197FC; --agua:#22D3EE; --bad:#FF6B6B; --ok:#3DDC84; --lime:#A3E635;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--agua);text-decoration:none}
.hidden{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px} .xs{font-size:11px}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.top .t span{font-size:13px;color:var(--muted)}
.top .t b{font-size:22px;font-weight:700}
.back{min-width:44px;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{min-width:40px;min-height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.hl{border-color:var(--agua)} .card.hlp{border-color:var(--gord)} .card.hlg{border-color:var(--kcal)} .card.hlo{border-color:var(--prot)}
.card.big{border-radius:20px;padding:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec b{font-size:14px;font-weight:700} .sec span{font-size:12px;color:var(--muted);text-align:right}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:68px;border-radius:14px;padding:10px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left;user-select:none;-webkit-user-select:none}
.card .tile{background:var(--card2)}
.tile b{font-size:13px;font-weight:600;color:var(--ink)} .tile small{font-size:11px;color:var(--muted)}
.tile.on{border-color:var(--c,var(--agua));background:color-mix(in srgb,var(--c,var(--agua)) 12%,var(--card2))} .tile.on small{color:var(--c,var(--agua))}
.tile.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card2))} .tile.no small{color:var(--bad)}
.tile:active,.chip:active,.btn:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:9px 13px;border-radius:19px;font-size:13px;background:var(--card2);color:var(--soft);border:1px solid var(--line)}
.chip.on{background:color-mix(in srgb,var(--c,var(--agua)) 14%,var(--card2));color:var(--c,var(--agua));border-color:var(--c,var(--agua))}
.btn{min-height:48px;border-radius:14px;background:var(--kcal);color:#0B0F14;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;padding:0 16px;width:100%}
.btn.c{background:var(--agua)} .btn.p{background:var(--gord)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;color:var(--agua);border:1px solid var(--agua)}
.btn.small{min-height:38px;font-size:13px;width:auto;border-radius:12px}
.inp{width:100%;min-height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;color-scheme:dark}
.inp:focus{outline:none;border-color:var(--agua)}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px} .fld label{font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--kcal))}
.bar.b8{height:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .l{display:flex;flex-direction:column;min-width:0} .row .l span{font-size:14px} .row .l small{font-size:11px;color:var(--muted)}
.row .r{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.ind{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ind .n{font-size:12px;color:var(--muted)} .ind .v{display:flex;align-items:baseline;gap:4px} .ind .v .num{font-size:26px} .ind .v small{font-size:12px;color:var(--muted)}
.ind .o{font-size:11px;color:var(--muted)}
.ring{width:104px;height:104px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring .c{display:flex;flex-direction:column;align-items:center} .ring .num{font-size:40px} .ring small{font-size:11px;color:var(--muted)}
.tl{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.tl .h{width:44px;font-size:12px;color:var(--muted);padding-top:2px;flex:none}
.tl .dot{width:12px;height:12px;border-radius:6px;margin-top:4px;flex:none;border:2px solid var(--c)}
.tl .dot.f{background:var(--c)}
.tl .x{flex:1;display:flex;flex-direction:column;min-width:0} .tl .x b{font-size:14px;font-weight:600} .tl .x small{font-size:11px;color:var(--muted)}
.tl .st{font-size:11px;color:var(--c);white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{min-height:38px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--agua);color:#0B0F14}
.serie{flex:1;min-height:48px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.serie b{font-size:14px} .serie small{font-size:10px;color:var(--muted)}
.serie.ok{background:#1A2418;border-color:var(--kcal)} .serie.ok b{color:var(--kcal)}
.serie.dif{background:#2A1F14;border-color:var(--prot)} .serie.dif b{color:var(--prot)}
.gif{width:52px;height:52px;border-radius:10px;background:var(--card);border:1px dashed #3A4552;display:grid;place-items:center;font-size:9px;color:var(--dim);flex:none;overflow:hidden}
.gif img{width:100%;height:100%;object-fit:cover}
.eq{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--soft);background:var(--card);border-radius:8px;padding:3px 7px}
.eq i{width:9px;height:9px;border-radius:5px;background:var(--c)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .w{text-align:center;font-size:10px;color:var(--dim);font-weight:600}
.cal .d{height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid transparent;user-select:none;-webkit-user-select:none}
.cal .d small{font-size:9px;color:var(--muted)} .cal .d .num{font-size:16px}
.cal .d.fer{outline:2px solid var(--agua);outline-offset:-1px} .cal .d.fol{outline:2px dashed var(--agua);outline-offset:-1px}
.cal .d.hj{box-shadow:inset 0 0 0 1px var(--ink)}
.lnk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px;min-height:64px;color:var(--ink);text-align:left;width:100%}
.lnk .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.lnk .x{flex:1;display:flex;flex-direction:column;gap:2px} .lnk .x b{font-size:15px;font-weight:600} .lnk .x small{font-size:12px;color:var(--muted)}
.pm{display:flex;align-items:center;gap:8px}
.pm button{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:18px}
.pm .q{min-width:64px;text-align:center;font-weight:700;font-size:14px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.aviso{background:#2A1F14;border:1px solid var(--prot);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;font-size:13px}
.aviso .num{font-size:28px;color:var(--prot)}
.load{padding:40px 0;text-align:center;color:var(--dim)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#0F141B;border-top:1px solid var(--line);padding:8px 4px calc(12px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--muted);font-size:11px}
nav button svg.i{width:22px;height:22px}
nav button.on{color:var(--agua);font-weight:600}
@media (min-width:600px){nav{left:50%;right:auto;width:560px;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(3,5,8,.7);display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#10151C;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
#sheet .shh{display:flex;justify-content:space-between;align-items:center} #sheet .shh b{font-size:17px}
#timer{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;max-width:528px;margin:0 auto;background:#11262B;border:1px solid var(--agua);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
#timer .num{font-size:34px;color:var(--agua)}
#timer .pm button{border-color:var(--agua);color:var(--agua);font-size:13px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:10;max-width:528px;margin:0 auto;background:#1a2029;border:1px solid #2a323e;color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px;animation:up .25s ease-out}
#toast button{color:var(--kcal);font-weight:800}
@keyframes up{from{transform:translateY(20px);opacity:0}}
#login{max-width:420px;margin:14vh auto 0;padding:0 20px;display:flex;flex-direction:column;gap:10px}
#login h1{font-family:'Barlow Condensed',sans-serif;font-size:56px;margin:0;color:var(--agua)}
.card2{--card:#151B23;--card2:#0B0F14}
</style>
<style>
/* chat (mantido do app anterior) */
.btn.small.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.grow{flex:1}
</style>
<style>
/* chat flutuante */
#fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:8;width:56px;height:56px;border-radius:50%;border:0;
  background:linear-gradient(145deg,var(--kcal),#1fb8ff);color:#04140b;display:grid;place-items:center;box-shadow:0 8px 26px #3cf28a55}
#fab svg.i{width:26px;height:26px}
#fab:active{transform:scale(.92)}
body.compr #fab{bottom:calc(156px + env(safe-area-inset-bottom))}
#chat{position:fixed;inset:0;z-index:30;background:rgba(3,5,8,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.chbox{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(600px 300px at 85% -60px,#1fb8ff22,transparent 70%),radial-gradient(500px 280px at 0% 0%,#3cf28a1c,transparent 70%),var(--bg);animation:up .22s ease-out}
@media (min-width:700px){.chbox{width:520px;height:min(760px,88vh);border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px #000c,0 0 0 1px #3cf28a14}}
.chh{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.chav{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;color:#04140b;background:linear-gradient(145deg,var(--kcal),#1fb8ff);box-shadow:0 6px 18px #3cf28a40}
.chav svg.i{width:22px;height:22px}
.chh .grow{flex:1;min-width:0}
.chh .grow b{font-size:17px;font-weight:900;letter-spacing:-.02em}
.chh .grow small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.chh .grow small i{width:7px;height:7px;border-radius:50%;background:var(--kcal);box-shadow:0 0 8px var(--kcal)}
.chib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center}
.chib svg.i{width:18px;height:18px}
.chib:active{transform:scale(.92)}
#chLog{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:#1d242e transparent}
.chvz{margin:auto 0;padding:8px 0;text-align:center}
.chvz .chav{width:64px;height:64px;border-radius:22px;margin:0 auto 14px}
.chvz .chav svg.i{width:30px;height:30px}
.chvz h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.chvz p{margin:6px auto 18px;max-width:320px;color:var(--muted);font-size:14px;line-height:1.4}
.chg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;text-align:left}
.chg button{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;color:var(--ink);display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;line-height:1.2}
.chg button:active{transform:scale(.96)}
.chg button span{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.chg button span svg.i{width:18px;height:18px}
.chg button div{min-width:0;text-align:left}
.chg button em{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.bl{max-width:84%;padding:10px 14px;border-radius:20px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:up .18s ease-out}
.bl.eu{align-self:flex-end;background:linear-gradient(145deg,var(--kcal),#2ad6a0);color:#04140b;border-bottom-right-radius:6px;font-weight:600}
.bl.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bl.ai.err{border-color:#ff4d5e66;background:#ff4d5e12}
.bl img{display:block;max-width:200px;border-radius:14px;margin-bottom:6px}
.bl .ac{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.bl .ac span{font-size:12.5px;font-weight:700;background:#3cf28a14;border:1px solid #3cf28a33;color:var(--kcal);border-radius:10px;padding:5px 9px}
.bl .tr{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px}
.bl.pens{color:var(--muted);display:flex;gap:8px;align-items:center}
.bl.pens:before{content:'';width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--kcal);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.chin{margin:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px #0008}
.chin:focus-within{border-color:#3cf28a66}
.chin textarea{flex:1;resize:none;min-height:40px;max-height:120px;border:0;outline:0;background:transparent;color:var(--ink);padding:10px 4px;font:inherit;font-size:15px}
.chin .cb{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);display:grid;place-items:center}
.chin .cb svg.i{width:19px;height:19px}
.chin .cb.send{background:var(--kcal);color:#04140b}
.chin .cb.rec{background:var(--bad);color:#fff;animation:pulso 1s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 8px #ff4d5e33}}
#chFoto{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
#chFoto img{height:48px;width:48px;object-fit:cover;border-radius:10px}


</style>
</head>
<body>
<section id="login" class="hidden">
  <h1>VINEK</h1>
  <p class="muted">Seu dia, registrado em segundos.</p>
  <form id="loginForm" class="card">
    <div class="fld"><label>Email</label><input class="inp" id="lEmail" type="email" value="cbkevin19@gmail.com" autocomplete="username" required></div>
    <div class="fld"><label>Senha</label><input class="inp" id="lPass" type="password" autocomplete="current-password" minlength="8" required></div>
    <button class="btn c" type="submit">Entrar</button>
    <p id="lMsg" class="muted small"></p>
  </form>
</section>

<div id="app" class="hidden">
  <main id="view"><div class="load">carregando…</div></main>
  <nav id="nav">
    <button data-go="hoje"></button>
    <button data-go="registrar"></button>
    <button data-go="financas"></button>
    <button data-go="treino"></button>
    <button data-go="mais"></button>
  </nav>
</div>

<div id="sheet" class="hidden"><div class="sh"><div class="shh"><b id="shTitle"></b><button class="back" id="shClose" aria-label="Fechar"></button></div><div id="shBody" style="display:flex;flex-direction:column;gap:10px"></div></div></div>
<div id="timer" class="hidden"><div><div id="tmL" class="muted small">descanso</div><div id="tmV" class="num">0:00</div></div><div class="pm"><button id="tmMais">+15s</button><button id="tmStop">Parar</button></div></div>
<button id="fab" class="hidden" aria-label="Registrar pelo chat"></button>
<div id="chat" class="hidden"><div class="chbox">
  <div class="chh"><div class="chav" id="chAv"></div><div class="grow"><b>Registro rápido</b><small><i></i>texto, áudio ou foto</small></div>
    <button class="chib" id="chLimpa" aria-label="Limpar conversa" title="Limpar conversa"></button><button class="chib" id="chX" aria-label="Fechar"></button></div>
  <div id="chLog"></div>
  <div id="chFoto" class="hidden"></div>
  <div class="chin">
    <button class="cb" id="chCam" aria-label="Foto"></button>
    <input type="file" id="chFile" accept="image/*" capture="environment" class="hidden">
    <textarea id="chTxt" rows="1" placeholder="Comeu, bebeu, gastou?"></textarea>
    <button class="cb" id="chMic" aria-label="Gravar áudio"></button>
  </div>
</div></div>
<div id="toast" class="hidden"><span id="tMsg"></span><button id="tUndo">Desfazer</button></div>

// ---------- datas (Brasil, UTC-3) ----------
const TZ = '-03:00';
const pad = n => String(n).padStart(2, '0');
function hojeISO() { return new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); }
function addDias(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const inicioDia = iso => iso + 'T00:00:00' + TZ;
const fimDia = iso => addDias(iso, 1) + 'T00:00:00' + TZ;
function horaLocal(ts) { const d = new Date(new Date(ts).getTime() - 3 * 3600e3); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
function agoraNoDia(iso) { const d = new Date(Date.now() - 3 * 3600e3); return iso + 'T' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':00' + TZ; }
function horaAgora() { const d = new Date(Date.now() - 3 * 3600e3); return d.getUTCHours() + d.getUTCMinutes() / 60; }
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dow = iso => new Date(iso + 'T12:00:00Z').getUTCDay();
const ddmm = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
function rotuloData(iso) {
  const h = hojeISO();
  const rel = iso === h ? 'Hoje' : iso === addDias(h, -1) ? 'Ontem' : iso === addDias(h, 1) ? 'Amanhã' : null;
  return { d: (rel ? rel + ', ' : '') + ddmm(iso), s: DIAS[dow(iso)] };
}
const fmt = (n, c = 0) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: c, minimumFractionDigits: 0 });
const brl = n => (n == null || isNaN(n)) ? '—' : 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const vibrar = () => { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const pct = (v, m) => m > 0 ? Math.max(0, Math.min(100, v / m * 100)) : 0;
const navy = (c, p, a) => 495 / (1.0324 - 0.19077 * Math.log10(c - p) + 0.15456 * Math.log10(a)) - 450;

// ---------- toast ----------
let toastTimer, undoFn;
function toast(msg, undo) {
  $('tMsg').textContent = msg; undoFn = undo;
  $('tUndo').classList.toggle('hidden', !undo);
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 6000);
}
$('tUndo').onclick = async () => { $('toast').classList.add('hidden'); if (undoFn) { await undoFn(); undoFn = null; render(); } };
function erro(e) { console.error(e); toast('Erro: ' + (e.message || e)); }

// ---------- sheet ----------
function abrirSheet(titulo, html) { $('shTitle').textContent = titulo; $('shBody').innerHTML = html; $('sheet').classList.remove('hidden'); }
function fecharSheet() { $('sheet').classList.add('hidden'); }
$('shClose').innerHTML = ic('x'); $('shClose').onclick = fecharSheet;
$('sheet').onclick = e => { if (e.target.id === 'sheet') fecharSheet(); };

// ---------- timer de descanso ----------
let tmFim = 0, tmInt = null;
function iniciarTimer(seg, rotulo) {
  if (!(seg > 0)) return;
  tmFim = Date.now() + seg * 1000; $('tmL').textContent = rotulo || 'descanso'; $('timer').classList.remove('hidden');
  clearInterval(tmInt); tmInt = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer() {
  const r = Math.max(0, Math.round((tmFim - Date.now()) / 1000));
  $('tmV').textContent = Math.floor(r / 60) + ':' + pad(r % 60);
  if (r <= 0) { clearInterval(tmInt); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} setTimeout(() => $('timer').classList.add('hidden'), 1500); }
}
$('tmMais').onclick = () => { tmFim += 15000; tickTimer(); };
$('tmStop').onclick = () => { clearInterval(tmInt); $('timer').classList.add('hidden'); };

// ---------- navegação ----------
const NAV = [['hoje', 'house', 'Hoje'], ['registrar', 'plus', 'Registrar'], ['financas', 'wallet', 'Finanças'], ['treino', 'dumbbell', 'Treino'], ['mais', 'layout-grid', 'Mais']];
document.querySelectorAll('#nav button').forEach((b, i) => { b.innerHTML = ic(NAV[i][1]) + NAV[i][2]; });
const PAI = { finreg: 'financas', semana: 'treino', modelo: 'treino', biblioteca: 'treino', evolucao: 'mais', corpo: 'mais', despensa: 'mais', regras: 'mais', checkin: 'mais' };
const COM_DIA = ['hoje', 'registrar', 'treino', 'checkin'];
const ROTAS = {};
function rota() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'hoje';
  const [r, ...resto] = h.split('/');
  return { r: ROTAS[r] ? r : 'hoje', arg: resto.join('/') || null };
}
function ir(r) { if (location.hash.slice(1) === r) render(); else location.hash = r; }
window.addEventListener('hashchange', () => { if (location.hash === '#chat') return; window.scrollTo(0, 0); render(); });
let renderSeq = 0, pos = null;
async function render() {
  if (!iniciado) return;
  const { r, arg } = rota(); S.tab = r; S.arg = arg;
  const pai = PAI[r] || r;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === pai));
  const seq = ++renderSeq; pos = null;
  try {
    const html = await ROTAS[r](arg);
    if (seq !== renderSeq) return;
    view.innerHTML = html;
    if (pos) pos();
  } catch (e) {
    console.error(e);
    if (seq === renderSeq) view.innerHTML = topo('Ops') + `<div class="card"><b>Não consegui carregar</b><span class="muted small">${esc(e.message || e)}</span><button class="btn ghost" data-a="recarregar">Tentar de novo</button></div>`;
  }
}
function topo(titulo, sub, op = {}) {
  const r = rotuloData(S.dia);
  const c = S.cal[S.dia];
  const left = op.voltar ? `<button class="back" data-go="${op.voltar}" aria-label="Voltar">${ic('chevron-left')}</button>` : '';
  const dia = COM_DIA.includes(S.tab) && !op.semDia ? `<div class="dnav">
      <button data-a="diaMenos" aria-label="Dia anterior">${ic('chevron-left')}</button>
      <label style="position:relative"><button tabindex="-1" style="pointer-events:none">${ic('calendar')}</button><input type="date" data-ch="diaPick" value="${S.dia}" style="position:absolute;inset:0;opacity:0;width:100%"></label>
      <button data-a="diaMais" aria-label="Próximo dia">${ic('chevron-right')}</button></div>` : (op.direita || '');

async function carregarDia(iso) {
  const ini = inicioDia(iso), fim = fimDia(iso);
  const q = await Promise.all([
    sb.from('refeicoes').select('*').gte('data_hora', ini).lt('data_hora', fim).order('data_hora'),
    sb.from('agua_log').select('*').gte('data_hora', ini).lt('data_hora', fim).order('data_hora'),
    sb.from('remedios_log').select('*').gte('tomado_em', ini).lt('tomado_em', fim),
    sb.from('cardio').select('*').eq('data', iso),
    sb.from('diario').select('*').eq('data', iso).maybeSingle(),
    sb.rpc('vinek_disciplina', { p_data: iso }),
    sb.from('disciplina_marcas').select('*').eq('data', iso),
    sb.from('treino_series').select('*').eq('data', iso),
    sb.from('treino_semana').select('*').eq('data', iso).maybeSingle(),
    sb.from('peso').select('*').eq('data', iso).order('id'),
    sb.from('pressao').select('*').gte('data_hora', ini).lt('data_hora', fim).order('data_hora'),
    sb.from('medidas_corporais').select('*').eq('data', iso).order('id'),
    sb.from('sono').select('*').eq('data', iso).maybeSingle(),
    sb.from('treinos').select('*').eq('data', iso),
  ]);
  const bad = q.find(x => x.error); if (bad) throw bad.error;
  const [ref, agua, remlog, cardio, diario, disc, marcas, series, semana, peso, pressao, medidas, sono, treinos] = q.map(x => x.data || []);
  const t = { kcal: 0, p: 0, c: 0, g: 0 };
  ref.forEach(r => { t.kcal += +r.kcal || 0; t.p += +r.proteina_g || 0; t.c += +r.carbo_g || 0; t.g += +r.gordura_g || 0; });
  const ml = agua.reduce((s, a) => s + (+a.ml || 0), 0);
  const bike = cardio.filter(c => c.modalidade === 'bike').reduce((s, c) => s + (+c.minutos || 0), 0);
  const tomados = new Set(remlog.filter(l => l.status === 'tomado').map(l => l.remedio_id));
  const M = {}; (marcas || []).forEach(m => M[m.chave] = +m.valor);
  const plano = planoDoDia(semana && semana.data ? semana : null);
  const feitas = (series || []).filter(s => s.reps_feitas != null || s.tempo_s != null).length;
  return { iso, ref, agua, remlog, cardio, diario: diario && diario.data ? diario : null, disc: disc || [], marcas: M, series: series || [], semana: semana && semana.data ? semana : null,
    peso, pressao, medidas, sono: sono && sono.data ? sono : null, treinos, t, ml, bike, tomados, plano, feitas };
}
function planoDoDia(sem) {
  if (!sem) return { modelo: null, itens: [], total: 0 };
  const modelo = S.mod.find(m => m.id === sem.modelo_id) || null;
  let itens = modelo ? S.itens.filter(i => i.modelo_id === modelo.id) : [];
  const core = S.mod.find(m => /core/i.test(m.letra || m.nome));
  if (sem.core && core && (!modelo || modelo.id !== core.id)) itens = itens.concat(S.itens.filter(i => i.modelo_id === core.id));
  itens = itens.slice().sort((a, b) => (a.modelo_id === core?.id) - (b.modelo_id === core?.id) || a.ordem - b.ordem);
  return { modelo, core: !!sem.core, itens, total: itens.reduce((s, i) => s + (+i.series || 0), 0) };
}

function agenda(D) {
  const iso = D.iso, d = dow(iso), fds = eFds(iso);
  const nRec = id => D.agua.filter(a => a.recipiente_id === id).length;
  const temRef = tipos => D.ref.some(r => tipos.includes(r.tipo));
  const vit = S.rem.filter(r => r.id !== 1).every(r => D.tomados.has(r.id));
  const L = [];
  const add = (h, nome, sub, feito, cor) => L.push({ h, nome, sub, feito, cor });
  if (!fds) {
    add('06:01', 'Pressão + bike', `bike ${fmt(D.bike)}/${metaNum('bike_min_dia', 40)} min`, D.bike > 0 && (D.pressao.length > 0 || iso > '2026-11-06'), 'var(--lime)');
    add('07:40', 'Garrafinha cinza + minoxidil', [2, 5].includes(d) ? 'e tirar o lixo' : '', nRec(3) > 0 && D.tomados.has(1), 'var(--agua)');
    add('08:30', 'Café da manhã', 'sanduba + caneca', temRef(['cafe']), 'var(--prot)');
    add('09:30', 'Garrafa do serviço', '580 ml', nRec(1) >= 1, 'var(--agua)');
    add('12:30', 'Almoço', '', temRef(['almoco']), 'var(--prot)');
    add('12:40', 'Vitaminas', 'vitamina C + polivitamínico', vit, 'var(--gord)');
    add('15:00', 'Garrafa do serviço', '2ª garrafa', nRec(1) >= 2, 'var(--agua)');
    add('17:55', 'Treino' + (D.plano.core ? ' + core' : ''), D.plano.modelo ? D.plano.modelo.nome : 'sem treino marcado', D.plano.total ? D.feitas >= D.plano.total : null, 'var(--prot)');
    add('18:00', 'Café/janta', 'bater a proteína', temRef(['jantar', 'lanche']), 'var(--prot)');
    add('19:30', 'Garrafinha verde', '500 ml', nRec(4) > 0, 'var(--agua)');
  } else {
    add(d === 6 ? '10:00' : '09:00', d === 6 ? 'Bike intervalado' : 'Bike', `${fmt(D.bike)}/${metaNum('bike_min_dia', 40)} min`, d === 0 && !D.bike ? null : D.bike > 0, 'var(--lime)');
    add('09:00', 'Minoxidil + garrafinha cinza', '', nRec(3) > 0 && D.tomados.has(1), 'var(--agua)');
    ['10:00', '12:30', '15:00', '17:30'].forEach((h, i) => add(h, 'Água', `${i + 1}ª garrafa do dia`, D.agua.length > i + 1, 'var(--agua)'));
    add('12:40', 'Vitaminas', 'vitamina C + polivitamínico', vit, 'var(--gord)');
    if (D.plano.total) add('17:00', 'Treino' + (D.plano.core ? ' + core' : ''), D.plano.modelo ? D.plano.modelo.nome : 'core', D.feitas >= D.plano.total, 'var(--prot)');
    if (d === 0) add('17:00', 'Despensa', 'inventário de domingo', null, 'var(--carb)');
  }
  add('22:27', 'Check-in', 'fechar o dia', !!(D.diario && D.diario.energia != null), 'var(--gord)');
  if ([0, 1, 2, 3, 4].includes(d)) add('22:45', 'Deitar', 'dormir até 00h', null, 'var(--dim)');
  return L.sort((a, b) => a.h.localeCompare(b.h));
}

async function serieEvo(ind, ini, fim) {
  const dias = {}; const put = (d, v) => { dias[d] = (dias[d] || 0) + v; };
  if (ind === 'nota') { const { data } = await sb.from('diario').select('data,nota_final').gte('data', ini).lte('data', fim); (data || []).forEach(d => d.nota_final != null && (dias[d.data] = +d.nota_final)); }
  if (ind === 'peso') { const { data } = await sb.from('peso').select('data,peso_kg').gte('data', ini).lte('data', fim).order('id'); (data || []).forEach(d => dias[d.data] = +d.peso_kg); }
  if (ind === 'kcal' || ind === 'proteina') { const { data } = await sb.from('refeicoes').select('data_hora,kcal,proteina_g').gte('data_hora', inicioDia(ini)).lt('data_hora', fimDia(fim)).limit(5000);
    (data || []).forEach(r => put(new Date(new Date(r.data_hora) - 3 * 3600e3).toISOString().slice(0, 10), +(ind === 'kcal' ? r.kcal : r.proteina_g) || 0)); }
  if (ind === 'agua') { const { data } = await sb.from('agua_log').select('data_hora,ml').gte('data_hora', inicioDia(ini)).lt('data_hora', fimDia(fim)).limit(5000);
    (data || []).forEach(r => put(new Date(new Date(r.data_hora) - 3 * 3600e3).toISOString().slice(0, 10), +r.ml || 0)); }
  if (ind === 'bike') { const { data } = await sb.from('cardio').select('data,minutos').eq('modalidade', 'bike').gte('data', ini).lte('data', fim); (data || []).forEach(r => put(r.data, +r.minutos || 0)); }

function grafico(dias, ini, n, cor, meta) {
  const xs = []; for (let k = 0; k < n; k++) { const d = addDias(ini, k); if (dias[d] != null) xs.push([k, dias[d]]); }
  if (!xs.length) return '<div class="empty">Sem dados no período</div>';
  const W = 320, H = 150, vals = xs.map(x => x[1]).concat(meta != null ? [meta] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; } const pd = (hi - lo) * .1; lo -= pd; hi += pd;
  const X = k => 8 + k / Math.max(1, n - 1) * (W - 16), Y = v => H - 18 - (v - lo) / (hi - lo) * (H - 30);
  const pts = xs.map(([k, v]) => X(k).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
  const last = xs[xs.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${meta != null ? `<line x1="8" x2="${W - 8}" y1="${Y(meta)}" y2="${Y(meta)}" stroke="#5B6673" stroke-dasharray="4 4"/><text x="${W - 8}" y="${Y(meta) - 4}" text-anchor="end" fill="#9AA6B2" font-size="10">meta ${fmt(meta)}</text>` : ''}
    <polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${xs.map(([k, v]) => `<circle cx="${X(k)}" cy="${Y(v)}" r="2.5" fill="${cor}"/>`).join('')}
    <text x="8" y="${H - 4}" fill="#5B6673" font-size="10">${ddmm(ini)}</text><text x="${W - 8}" y="${H - 4}" text-anchor="end" fill="#5B6673" font-size="10">${ddmm(addDias(ini, n - 1))}</text>
    <text x="${Math.min(W - 30, X(last[0]))}" y="${Y(last[1]) - 8}" text-anchor="middle" fill="${cor}" font-size="12" font-weight="700">${fmt(last[1], last[1] < 20 ? 1 : 0)}</text></svg>`;
}

  let h = topo('Check-in', undefined, {});

  h += `<div class="card" style="flex-direction:row;align-items:center;gap:14px"><div class="ring" style="width:72px;height:72px">${ringSvg(nota, corNota(nota), 72)}<div class="c"><span class="num" style="font-size:26px;color:${corNota(nota)}">${nota == null ? '—' : fmt(nota, 1)}</span></div></div>
    <span class="small muted" style="flex:1">Responda o que faltar e toque em Fechar o dia. A nota recalcula na hora.</span></div>`;
  h += `<div class="card">${sec('Como foi o dia', 'pode marcar mais de um')}<div class="chips">${TIPOS_DIA.map(t => chip('ckTipo', `data-v="${t}"`, t, (di.tipo_dia || []).includes(t), 'var(--gord)')).join('')}</div>
    <span class="small muted">Energia</span>${opc('energia', [[1, 'Baixa'], [3, 'Média'], [5, 'Alta']], 'var(--lime)')}</div>`;
  h += `<div class="card">${sec('Saúde')}<span class="small muted">Dor de cabeça</span>${opc('dor_cabeca', [['nao', 'Não'], ['fraca', 'Fraca'], ['forte', 'Forte']])}
    <span class="small muted">Intestino</span>${opc('intestino', [['nao', 'Não foi'], ['pouco', 'Pouco'], ['normal', 'Normal'], ['muito', 'Muito']])}
    ${simnao('colica', 'Cólica', false)}${simnao('refluxo', 'Refluxo', false)}${simnao('dormiu_bem', 'Dormiu bem (noite passada)')}</div>`;
  h += `<div class="card">${sec('Davi e projetos')}<span class="small muted">Contato com o Davi</span>${opc('davi_contato', [['nenhum', 'Sem contato'], ['mensagem', 'Mensagem'], ['ligacao', 'Ligação'], ['jogamos', 'Jogamos junto']], 'var(--prot)')}
    <span class="small muted">Projetos</span>${opc('projetos_nota', [[0, 'Nada'], [5, 'Um pouco'], [10, 'Avancei bem']], 'var(--prot)')}
    ${simnao('registrou_gastos', 'Registrou os gastos do dia')}</div>`;
  h += cardDisciplina(D, true).replace('Disciplina', 'Disciplina pendente');
  const tot = (sf.data || []).reduce((s, r) => s + (+r.minutos || 0), 0);
  h += `<div class="card">${sec('Tempo de tela (StayFree)', fmt(tot) + ' min')}${(sf.data || []).map(r => `<div class="row"><div class="l"><span>${esc(r.app)}</span><small>${esc(r.dispositivo)}</small></div><div class="r">${r.minutos} min</div></div>`).join('')}
    <div class="seg">${['celular', 'pc', 'navegador'].map(d => `<button class="${(S.ui.sfDisp || 'celular') === d ? 'on' : ''}" data-a="sfDisp" data-v="${d}">${d}</button>`).join('')}</div>
    <div style="display:flex;gap:8px"><input class="inp" id="sfApp" value="Instagram" style="flex:2"><input class="inp" id="sfMin" inputmode="numeric" placeholder="min" style="flex:1"></div>
    <button class="btn small ghost" data-a="sfSalvar" style="width:100%">Salvar tempo</button></div>`;
  h += `<div class="card">${sec('Observação')}<textarea class="inp" id="ckObs" placeholder="Algo que vale lembrar do dia?">${esc(di.observacao || '')}</textarea></div>
    <button class="btn p" data-a="ckFechar">${ic('check')} Fechar o dia</button>`;
  return h;
};
A.ckSet = async el => { vibrar(); const k = el.dataset.k, v = el.dataset.v; await salvarDiario({ [k]: /^\d+$/.test(v) && ['energia', 'projetos_nota'].includes(k) ? +v : v }); render(); };
A.ckBool = async el => { vibrar(); await salvarDiario({ [el.dataset.k]: el.dataset.v === '1' }); render(); };
A.ckTipo = async el => {
  vibrar(); const t = new Set((S.D.diario || {}).tipo_dia || []);
  t.has(el.dataset.v) ? t.delete(el.dataset.v) : t.add(el.dataset.v);
  await salvarDiario({ tipo_dia: [...t] }); render();
};
A.sfDisp = el => { S.ui.sfDisp = el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); };
A.sfSalvar = async () => {
  const app = $('sfApp').value.trim(), min = num($('sfMin').value);
  if (!app || min == null) return toast('Informe o app e os minutos');
  const { error } = await sb.from('stayfree_uso').upsert({ data: S.dia, dispositivo: S.ui.sfDisp || 'celular', app, categoria: /instagram/i.test(app) ? 'instagram' : null, minutos: Math.round(min) }, { onConflict: 'data,dispositivo,app' });
  if (error) return erro(error); vibrar(); toast('✓ ' + app + ' ' + Math.round(min) + ' min'); render();
};
A.ckFechar = async () => {
  const obs = $('ckObs').value.trim();
  if (obs !== ((S.D.diario || {}).observacao || '')) await salvarDiario({ observacao: obs || null });
  const { data, error } = await sb.rpc('calcular_nota_dia', { p_data: S.dia });
  if (error) return erro(error);
  const r = await sb.from('diario').select('nota_final').eq('data', S.dia).maybeSingle();
  vibrar(); toast('✓ Dia fechado · nota ' + fmt(r.data && r.data.nota_final, 1)); render();
};
const CH = { msgs: [], foto: null, rec: null, pedacos: [], enviando: false };
try { CH.msgs = JSON.parse(localStorage.getItem('vinek-chat') || '[]'); } catch (e) {}
const salvarChat = () => { try { localStorage.setItem('vinek-chat', JSON.stringify(CH.msgs.slice(-40).map(m => ({ ...m, img: null })))); } catch (e) {} };
$('fab').innerHTML = ic('message-circle'); $('chCam').innerHTML = ic('camera'); $('chAv').innerHTML = ic('sparkles');
$('chLimpa').innerHTML = ic('trash-2'); $('chX').innerHTML = ic('x');
$('chat').onclick = e => { if (e.target.id === 'chat') $('chX').onclick(); };
$('fab').onclick = abrirChat;
$('chX').onclick = () => { $('chat').classList.add('hidden'); if (location.hash === '#chat') history.replaceState(null, '', '#' + S.tab); };
$('chCam').onclick = () => $('chFile').click();
$('chLimpa').onclick = () => { if (CH.enviando) return; CH.msgs = []; salvarChat(); desenharChat(); };
const SUG = [
  ['droplet', 'var(--agua)', 'Água', 'Bebi a garrafa azul'],
  ['donut', 'var(--prot)', 'Beliscar', 'Comi 2 rosquinhas'],
  ['utensils', 'var(--kcal)', 'Refeição', 'Almocei 150 g de arroz pronto e 120 g de frango'],
  ['wallet', 'var(--carb)', 'Gasto', 'Gastei R$ 25 no mercado'],
  ['camera', 'var(--gord)', 'Notinha', ''],
  ['list-checks', '#1fb8ff', 'Tarefa', 'Me lembra de pagar o advogado dia 20'],
];
function abrirChat() {
  vibrar(); $('chat').classList.remove('hidden'); desenharChat();
  if (matchMedia('(min-width:700px)').matches) setTimeout(() => $('chTxt').focus(), 50);
}
function desenharChat() {
  const L = $('chLog');
  L.innerHTML = CH.msgs.length ? CH.msgs.map(m => `<div class="bl ${m.role === 'user' ? 'eu' : 'ai'}${m.erro ? ' err' : ''}${m.pens ? ' pens' : ''}">${m.img ? `<img src="${m.img}">` : ''}${m.tr ? `<div class="tr">🎤 ${esc(m.tr)}</div>` : ''}${esc(m.content)}${m.acoes?.length ? `<div class="ac">${m.acoes.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}</div>`).join('')
    : `<div class="chvz"><div class="chav">${ic('sparkles')}</div><h3>O que rolou?</h3><p>Escreva, mande um áudio ou a foto da notinha. Eu calculo e registro tudo sozinho.</p>
      <div class="chg">${SUG.map(([i, c, t, ex], n) => `<button data-sug="${n}" style="--c:${c}"><span>${ic(i)}</span><div>${t}<em>${ex ? esc(ex) : 'Foto do cupom'}</em></div></button>`).join('')}</div></div>`;
  L.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { const ex = SUG[+b.dataset.sug][3]; if (!ex) return $('chFile').click(); $('chTxt').value = ex; $('chTxt').oninput(); $('chTxt').focus(); });
  L.scrollTop = L.scrollHeight;
}
function botaoChat() {
  const temTexto = $('chTxt').value.trim() || CH.foto;
  const b = $('chMic');
  b.className = 'cb' + (CH.rec ? ' rec' : temTexto ? ' send' : '');
  b.innerHTML = ic(CH.rec ? 'square' : temTexto ? 'send' : 'mic');
  b.setAttribute('aria-label', CH.rec ? 'Parar e enviar' : temTexto ? 'Enviar' : 'Gravar áudio');
}
$('chTxt').oninput = () => { const t = $('chTxt'); t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; botaoChat(); };
$('chTxt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarChat({}); } };
$('chMic').onclick = () => CH.rec ? CH.rec.stop() : ($('chTxt').value.trim() || CH.foto) ? enviarChat({}) : gravarAudio();
botaoChat();

$('chFile').onchange = async () => {
  const f = $('chFile').files[0]; $('chFile').value = ''; if (!f) return;
  try {
    const img = await new Promise((ok, nok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nok; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.82);
    CH.foto = { b64: url.split(',')[1], url };
    $('chFoto').innerHTML = `<img src="${url}"><span class="grow">Foto pronta. Escreva algo (opcional) e envie.</span><button class="btn small ghost" id="chFotoX">Tirar</button>`;
    $('chFoto').classList.remove('hidden');
    $('chFotoX').onclick = () => { CH.foto = null; $('chFoto').classList.add('hidden'); botaoChat(); };
    botaoChat();
  } catch (e) { erro('Não consegui abrir a foto'); }
};

async function gravarAudio() {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Esse navegador não grava áudio.');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const tipo = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
    const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
    CH.pedacos = []; CH.rec = rec; vibrar(); botaoChat();
    $('chTxt').placeholder = 'Gravando... toque no quadrado para enviar';
    rec.ondataavailable = e => e.data.size && CH.pedacos.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); CH.rec = null; botaoChat();
      $('chTxt').placeholder = 'Comi, bebi, gastei...';
      const blob = new Blob(CH.pedacos, { type: rec.mimeType || tipo || 'audio/webm' });
      if (blob.size < 1500) return toast('Áudio muito curto.');
      const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
      enviarChat({ audio_b64: b64, audio_mime: blob.type });
    };
    rec.start();
    setTimeout(() => { if (CH.rec === rec) rec.stop(); }, 120000);
  } catch (e) { toast('Sem acesso ao microfone. Libere nas permissões do navegador.'); }
}

async function enviarChat(extra) {
  if (CH.enviando) return;
  const texto = $('chTxt').value.trim(), foto = CH.foto;
  if (!texto && !foto && !extra.audio_b64) return;
  CH.enviando = true; vibrar();
  const historico = CH.msgs.filter(m => !m.pens && !m.erro).slice(-6).map(m => ({ role: m.role, content: m.content }));
  CH.msgs.push({ role: 'user', content: texto || (extra.audio_b64 ? '🎤 áudio' : '📷 foto'), img: foto?.url || null });
  const pens = { role: 'assistant', content: extra.audio_b64 ? 'Ouvindo...' : foto ? 'Lendo a foto...' : 'Registrando...', pens: true };
  CH.msgs.push(pens);
  $('chTxt').value = ''; $('chTxt').style.height = 'auto'; CH.foto = null; $('chFoto').classList.add('hidden'); botaoChat(); desenharChat();
  const hoje = S.dia === hojeISO();
  const body = { texto, dia: S.dia, hora: hoje ? horaLocal(Date.now()) : '12:00', historico, ...extra,
    ...(foto ? { imagem_b64: foto.b64, imagem_mime: 'image/jpeg' } : {}) };
  let r;
  try {
    const { data: ss } = await sb.auth.getSession();
    const resp = await fetch(SB_URL + '/functions/v1/chat', { method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + ss.session?.access_token }, body: JSON.stringify(body) });
    r = await resp.json().catch(() => ({ erro: 'resposta inválida (' + resp.status + ')' }));
  } catch (e) { r = { erro: 'sem conexão' }; }
  CH.msgs.splice(CH.msgs.indexOf(pens), 1);
  if (extra.audio_b64 && r.transcricao) CH.msgs[CH.msgs.length - 1].content = '🎤 ' + r.transcricao;
  CH.msgs.push(r.erro && !r.acoes?.length
    ? { role: 'assistant', content: 'Não deu: ' + r.erro, erro: true }
    : { role: 'assistant', content: r.resposta || r.erro || 'Feito.', acoes: r.acoes || [] });
  CH.enviando = false; salvarChat(); desenharChat();
  if (r.acoes?.length) { vibrar(); render(); }
}


document.addEventListener('visibilitychange', () => {
  if (!document.hidden && iniciado && $('sheet').classList.contains('hidden') && !['finreg', 'checkin'].includes(S.tab) && !document.activeElement?.matches('input,textarea')) render();
});
(async () => {
  const { data } = await sb.auth.getSession();
  data.session ? iniciar() : mostrarLogin();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
